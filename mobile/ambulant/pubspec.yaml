publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  daba_shared:
    path: ../shared
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  http: ^1.6.0
  latlong2: ^0.10.1
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
