  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
