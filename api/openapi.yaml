openapi: 3.1.0
info:
  title: Daba API
  version: 0.3.0
  description: |
    Contrat unique entre le back-end, les apps mobiles (ambulant, hanout) et les portails web.
    Changement incompatible = nouvelle version de l'endpoint (/v2/...), jamais de rupture silencieuse.

    **Cloisonnement multi-tenant.** Chaque appel authentifié est cloisonné par l'organisation
    portée par le jeton (`organisationId` de la Session) ; aucun chemin ne prend l'organisation
    en paramètre. Une ressource d'une autre organisation répond 404, comme une ressource inexistante.
    Les seules lectures croisées sont celles du métier, et elles sont limitées aux champs décrits :
    - la marque voit les dépôts de ses campagnes (jamais les ambulants ni les hanouts, §5.4) ;
    - le grossiste voit les réservations faites sur ses dépôts ;
    - l'ambulant voit les offres promo (campagnes et dépôts d'autres organisations), les demandes
      de dépannage qui lui sont proposées et les bons de sortie qui lui sont adressés ;
    - le hanout voit les documents qui lui sont adressés, ses comptes de crédit et leurs relevés.

    **Langues.** Les clients affichent à partir des codes (enums, `Problem.type`, `regle`) ; les
    textes libres renvoyés par le serveur suivent l'en-tête `Accept-Language` (fr, ar, ary-Arab, ary-Latn).
    `x-roles` liste les rôles autorisés ; un autre rôle reçoit 403.

    **Hors ligne.** Toutes les écritures de l'app ambulant passent par `POST /v1/sync/operations`
    (UUID générés par l'appareil, rejouables sans effet de bord). Seules la réservation d'une promo
    et les actions de dépannage (disponibilité, acceptation) exigent le réseau.

    **Montants** en centimes de dirham (entiers). **Quantités** en unités du produit
    (un produit = un code EAN et un conditionnement).

    **Erreurs** au format RFC 9457 ; `regle` nomme la règle de gestion violée (ex. RG-P3).
  license:
    name: Propriétaire
    identifier: LicenseRef-Daba-Proprietaire
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

tags:
  - name: comptes
    description: Authentification OTP, appareils, liens signés
  - name: referentiel
    description: Hanouts (base POS RED), produits, grossistes
  - name: sync
    description: Synchronisation de l'app ambulant hors ligne
  - name: stock
    description: Stock embarqué, mouvements (RG-S*), bons de sortie
  - name: ventes
    description: Bons de livraison, factures, avoirs, versements, karni (RG-C*, RG-F*)
  - name: promos
    description: Campagnes, dépôts, réservations, retraits (§7.2, RG-P*)
  - name: depannage
    description: Ruptures signalées par les hanouts et dispatch (§7.1, RG-D*)
  - name: analytique
    description: Données agrégées et anonymisées pour les grands clients (§5.4)

paths:
  # ---------------------------------------------------------------- comptes
  /v1/auth/otp:
    post:
      tags: [comptes]
      operationId: demanderOtp
      summary: Envoie un code OTP par SMS au numéro donné, ou au numéro d'un lien signé
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code envoyé (réponse identique que le numéro soit connu ou non)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '400':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/LienExpire'
        '429':
          $ref: '#/components/responses/Problem'

  /v1/auth/otp/verify:
    post:
      tags: [comptes]
      operationId: verifierOtp
      summary: Vérifie le code OTP et ouvre une session sur l'appareil
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Code valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/LienExpire'
        '429':
          $ref: '#/components/responses/Problem'

  /v1/auth/refresh:
    post:
      tags: [comptes]
      operationId: rafraichirSession
      summary: Renouvelle la session de l'appareil avec le refreshToken (valable 90 jours)
      description: |
        L'accessToken vaut 24 h ; l'app le renouvelle ici, sans nouvel OTP, tant que l'appareil
        n'est pas déconnecté à distance. 401 si le refreshToken est invalide ou l'appareil révoqué.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nouvelle session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/liens/{jeton}:
    get:
      tags: [comptes]
      operationId: ouvrirLien
      summary: Résout un lien hanout signé reçu par SMS (sans authentification)
      description: |
        Le lien est signé et à durée limitée. Il ne donne accès à aucune donnée :
        il indique seulement la cible, que la PWA affiche après connexion OTP
        (`POST /v1/auth/otp` avec `lienJeton`).
      security: []
      parameters:
        - name: jeton
          in: path
          required: true
          schema:
            type: string
            minLength: 16
      responses:
        '200':
          description: Lien valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LienCible'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/LienExpire'

  /v1/appareils/{appareilId}/push:
    put:
      tags: [comptes]
      operationId: enregistrerJetonPush
      summary: Enregistre ou remplace le jeton push de l'appareil connecté
      x-roles: [AMBULANT, HANOUT, GROSSISTE]
      parameters:
        - $ref: '#/components/parameters/AppareilId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JetonPush'
      responses:
        '204':
          description: Jeton enregistré
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/moi/consentement:
    get:
      tags: [comptes]
      operationId: lireConsentement
      summary: Consentement CNDP de l'utilisateur connecté (loi 09-08)
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT]
      responses:
        '200':
          description: Dernier consentement enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [comptes]
      operationId: enregistrerConsentement
      summary: Enregistre ou retire le consentement (journalisé, horodaté, avec la version du texte)
      description: |
        Tant que le dernier consentement enregistré n'a pas `traitementDonnees = true`, toute
        opération authentifiée répond 403 (Problem `type` …/consentement-requis, quelle que soit
        la connexion), sauf `GET`/`PUT /v1/moi/consentement`, `GET /v1/moi/donnees` (droit d'accès)
        et `POST /v1/sync/operations` : les pièces de vente déjà émises doivent pouvoir remonter
        (obligation légale de conservation, RG-C4).
        Retirer `geolocalisation` coupe la disponibilité de l'ambulant et efface sa dernière position.
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentementSaisie'
      responses:
        '200':
          description: Consentement enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentement'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/moi/donnees:
    get:
      tags: [comptes]
      operationId: exporterMesDonnees
      summary: Droit d'accès (loi 09-08) — export des données personnelles de l'utilisateur connecté
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT]
      responses:
        '200':
          description: Export JSON (profil, consentements, appareils, positions conservées)
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/organisations:
    post:
      tags: [comptes]
      operationId: creerOrganisation
      summary: L'administrateur inscrit un grossiste ou un grand client et ses utilisateurs
      description: |
        Les ambulants s'inscrivent seuls par OTP ; un numéro présent dans la base POS devient un
        compte HANOUT à sa première connexion. Grossistes et grands clients sont créés ici ; leurs
        utilisateurs se connectent ensuite par OTP. 409 si un numéro est déjà inscrit.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationSaisie'
      responses:
        '201':
          description: Organisation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreee'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/photos/{photoId}:
    get:
      tags: [comptes]
      operationId: lirePhoto
      summary: Photo envoyée par un utilisateur (bon de livraison d'un dépôt, rupture signalée en photo)
      description: |
        Cible des champs `photoBonLivraisonUrl` et `photoUrl`. Identifiant non devinable,
        réservé aux utilisateurs connectés.
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT, ADMIN]
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- referentiel
  /v1/hanouts:
    get:
      tags: [referentiel]
      operationId: listerHanouts
      summary: Liste les hanouts (base POS fournie par RED)
      description: |
        Recherche par nom ou téléphone (`q`) et/ou par proximité (`lat`, `lon`, `rayonM`).
        Avec une position, les résultats sont triés par distance croissante.
        CNDP : `lat`/`lon` est uniquement le centre de la carte choisi par l'utilisateur, jamais
        la position GPS de l'appareil ; il n'est ni stocké ni journalisé. Pour trier autour de
        lui, l'app utilise les hanouts déjà synchronisés (entité HANOUT) et calcule la distance
        sur l'appareil.
      x-roles: [AMBULANT, ADMIN]
      parameters:
        - name: q
          in: query
          description: Nom du hanout, nom du gérant ou téléphone
          schema:
            type: string
            minLength: 2
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - $ref: '#/components/parameters/RayonM'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de hanouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HanoutPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/produits:
    get:
      tags: [referentiel]
      operationId: listerProduits
      summary: Recherche dans le référentiel produits
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT, ADMIN]
      parameters:
        - name: q
          in: query
          description: Libellé (toutes langues) ou marque
          schema:
            type: string
            minLength: 2
        - name: ean
          in: query
          schema:
            $ref: '#/components/schemas/Ean'
        - name: categorie
          in: query
          schema:
            type: string
        - name: habituels
          in: query
          description: Hanout seulement — restreint aux produits qu'il a déjà achetés à ses ambulants (signalement de rupture)
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de produits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduitPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/grossistes:
    get:
      tags: [referentiel]
      operationId: listerGrossistes
      summary: Liste les grossistes, sur carte ou filtrés (choix des dépositaires, §5.2)
      x-roles: [GRAND_CLIENT, ADMIN]
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
        - name: ville
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - $ref: '#/components/parameters/RayonM'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de grossistes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrossistePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/hanouts/import:
    post:
      tags: [referentiel]
      operationId: importerHanouts
      summary: Importe la base POS fournie par RED (CSV)
      description: |
        CSV UTF-8, séparateur « ; » ou « , », première ligne d'en-têtes : code_pos, nom, gerant,
        telephone, lat, lon, adresse, ville, ice. Clé : code_pos (réimporter met à jour). Téléphones
        06…, 2126… ou 002126… acceptés. Une ligne invalide est rejetée avec son numéro, les autres passent.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FichierImport'
      responses:
        '200':
          description: Bilan de l'import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BilanImport'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/produits/import:
    post:
      tags: [referentiel]
      operationId: importerProduits
      summary: Importe le référentiel produits (CSV)
      description: |
        En-têtes : ean, libelle_fr, libelle_ar, libelle_ary_arab, libelle_ary_latn, marque, categorie,
        conditionnement (UNITE, PACK, CARTON), unites, photo_url, grand_client_id (organisation
        propriétaire, pour la carte des ruptures). Clé : ean.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FichierImport'
      responses:
        '200':
          description: Bilan de l'import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BilanImport'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- sync
  /v1/sync/operations:
    post:
      tags: [sync]
      operationId: pousserOperations
      summary: Envoie un lot d'opérations enregistrées hors ligne
      description: |
        Les opérations sont appliquées dans l'ordre du tableau. Chacune porte un UUID généré par
        l'appareil : la rejouer renvoie `DEJA_APPLIQUEE` sans nouvel effet (idempotence).
        Une opération qui reflète un fait terrain (vente, versement, chargement) n'est jamais refusée
        pour une règle de gestion : elle est appliquée et signalée en anomalie (RG-S1, RG-C3, RG-F1…).
        Seule une opération mal formée (dont une FACTURE sans `mentionsLegales`, RG-F2, un numéro
        dont le préfixe n'est pas celui de l'appareil, RG-F1, ou un AVOIR supérieur au restant à
        annuler du document d'origine, RG-C4) ou qui référence un objet inconnu est `REJETEE` ;
        elle est journalisée et
        l'appareil doit l'afficher. Aucun écrasement silencieux : tout conflit est
        résolu côté serveur, journalisé et décrit dans le résultat.
      x-roles: [AMBULANT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotOperations'
      responses:
        '200':
          description: Un résultat par opération, dans l'ordre reçu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatLot'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AppareilRevoque'
        '413':
          $ref: '#/components/responses/Problem'

  /v1/sync/changements:
    get:
      tags: [sync]
      operationId: tirerChangements
      summary: Récupère les changements depuis un curseur (synchronisation différentielle)
      description: |
        Sans curseur, renvoie l'état initial complet de l'appareil. Appeler tant que
        `plusDeChangements` est vrai, puis conserver le dernier `curseur`.
        Les documents de vente ne sont jamais supprimés : un avoir arrive comme un nouveau document.
      x-roles: [AMBULANT]
      parameters:
        - name: curseur
          in: query
          description: Curseur opaque renvoyé par l'appel précédent
          schema:
            type: string
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Changements, du plus ancien au plus récent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotChangements'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AppareilRevoque'
        '410':
          description: Curseur trop ancien ; repartir d'une synchronisation complète (sans curseur)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ---------------------------------------------------------------- stock
  /v1/stock:
    get:
      tags: [stock]
      operationId: lireStockEmbarque
      summary: Stock embarqué actuel de l'ambulant connecté, stock promo isolé par campagne (RG-S3)
      x-roles: [AMBULANT]
      responses:
        '200':
          description: Stock calculé à partir des mouvements reçus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockEmbarque'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/stock/mouvements:
    get:
      tags: [stock]
      operationId: listerMouvements
      summary: Journal des mouvements du stock embarqué (RG-S2)
      x-roles: [AMBULANT]
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TypeMouvement'
        - name: produitId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Depuis'
        - $ref: '#/components/parameters/Jusqua'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de mouvements, du plus récent au plus ancien
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MouvementPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/bons-sortie:
    post:
      tags: [stock]
      operationId: creerBonSortie
      summary: Le grossiste émet un bon de sortie pour un ambulant
      description: |
        Le bon est adressé à un ambulant et lui est transmis automatiquement par synchronisation
        (entité BON_SORTIE, §4.3). L'ambulant confirme la réception physique en scannant le QR
        (`qrJeton`), même hors ligne : opération `CHARGEMENT`. Un bon ne se charge qu'une fois,
        et seulement par son destinataire.
      x-roles: [GROSSISTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BonSortieSaisie'
      responses:
        '200':
          description: Bon déjà émis par une requête précédente au même id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonSortie'
        '201':
          description: Bon émis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonSortie'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [stock]
      operationId: listerBonsSortie
      summary: Bons de sortie émis par le grossiste connecté
      x-roles: [GROSSISTE]
      parameters:
        - $ref: '#/components/parameters/Depuis'
        - $ref: '#/components/parameters/Jusqua'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de bons de sortie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonSortiePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/bons-sortie/{bonSortieId}:
    get:
      tags: [stock]
      operationId: lireBonSortie
      summary: Détail d'un bon de sortie
      x-roles: [GROSSISTE]
      parameters:
        - name: bonSortieId
          in: path
