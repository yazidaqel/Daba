      operationId: validerRetrait
      summary: Valide le retrait par scan du QR code de réservation (RG-P4)
      description: |
        Le QR doit désigner une réservation RESERVEE sur un dépôt du grossiste connecté (422 sinon,
        RG-P4) ; une réservation expirée ou déjà retirée répond 409. Le plafond par ambulant est
        recontrôlé (422, RG-P3). Une quantité remise inférieure à la réservée rend la différence
        au disponible. Le retrait crée un mouvement PROMO dans le stock embarqué de l'ambulant,
        rattaché à la campagne (RG-S3), livré par synchronisation.
      x-roles: [GROSSISTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetraitSaisie'
      responses:
        '201':
          description: Retrait validé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # ---------------------------------------------------------------- depannage
  /v1/ambulant/disponibilite:
    get:
      tags: [depannage]
      operationId: lireDisponibilite
      summary: État du bouton « disponible » de l'ambulant connecté
      x-roles: [AMBULANT]
      responses:
        '200':
          description: Disponibilité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [depannage]
      operationId: changerDisponibilite
      summary: Active ou coupe la disponibilité, et met à jour la position tant qu'elle est active
      description: |
        CNDP (loi 09-08) : la position n'est acceptée qu'avec `disponible = true` et un consentement
        `geolocalisation` enregistré (`PUT /v1/moi/consentement`, sinon 422) ; passer à `false`
        efface la dernière position connue côté serveur. `disponible = false` est toujours accepté,
        sans position (une position envoyée est ignorée, jamais stockée) et même s'il l'est déjà :
        l'app l'envoie au démarrage et après une coupure hors ligne.
        L'app renvoie la même requête pour mettre à jour la position pendant la tournée.
      x-roles: [AMBULANT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibiliteSaisie'
      responses:
        '200':
          description: Disponibilité mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilite'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /v1/demandes-depannage:
    post:
      tags: [depannage]
      operationId: signalerRupture
      summary: Le hanout signale une rupture (produit choisi dans ses achats habituels, ou photo)
      description: |
        Envoyée seulement aux ambulants disponibles, dans le rayon, ayant le produit en stock
        déclaré (RG-D1). Sans acceptation dans le délai, le rayon s'élargit une fois, puis le
        hanout est prévenu (RG-D3). L'`id` vient de l'appareil : renvoyer la même requête rend
        la demande existante (200).

        **Signalement en photo seule (sans `produitId`) : question ouverte.** Le cahier des charges
        (RG-D1, §6) ne dit pas à qui l'envoyer, puisque le critère « produit en stock déclaré » ne
        s'applique pas. À trancher avec RED ; en attendant, le serveur l'envoie à tous les
        ambulants disponibles du rayon, sans filtre de stock.
      x-roles: [HANOUT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuptureSaisie'
          multipart/form-data:
            schema:
              type: object
              required: [rupture, photo]
              properties:
                rupture:
                  $ref: '#/components/schemas/RuptureSaisie'
                photo:
                  type: string
                  contentMediaType: image/jpeg
            encoding:
              rupture:
                contentType: application/json
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Demande déjà créée par une requête précédente au même id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDepannage'
        '201':
          description: Demande créée et dispatchée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDepannage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/Problem'
    get:
      tags: [depannage]
      operationId: listerDemandesDepannage
      summary: Demandes du hanout connecté, ou demandes proposées à l'ambulant connecté et celles qu'il a prises
      description: |
        Pour l'ambulant, une demande prise par un autre ou qu'il a refusée disparaît de la liste (RG-D2).
      x-roles: [HANOUT, AMBULANT]
      parameters:
        - name: statut
          in: query
          schema:
            $ref: '#/components/schemas/StatutDemande'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page de demandes, de la plus récente à la plus ancienne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDepannagePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/demandes-depannage/{demandeId}:
    get:
      tags: [depannage]
      operationId: lireDemandeDepannage
      summary: Suivi d'une demande (acceptée par tel ambulant, en route, livrée)
      x-roles: [HANOUT, AMBULANT]
      parameters:
        - $ref: '#/components/parameters/DemandeId'
      responses:
        '200':
          description: Demande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDepannage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/demandes-depannage/{demandeId}/acceptation:
    post:
      tags: [depannage]
      operationId: accepterDemandeDepannage
      summary: L'ambulant accepte la demande ; le premier qui accepte la prend (RG-D2)
      description: |
        Les suivants reçoivent 409 et la demande disparaît de leur liste. Rejouer l'acceptation
        par le même ambulant renvoie 200.
      x-roles: [AMBULANT]
      parameters:
        - $ref: '#/components/parameters/DemandeId'
      responses:
        '200':
          description: Demande attribuée à l'ambulant connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDepannage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/demandes-depannage/{demandeId}/refus:
    post:
      tags: [depannage]
      operationId: refuserDemandeDepannage
      summary: L'ambulant refuse la demande ; elle disparaît de sa liste
      x-roles: [AMBULANT]
      parameters:
        - $ref: '#/components/parameters/DemandeId'
      responses:
        '204':
          description: Refus enregistré
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/demandes-depannage/{demandeId}/en-route:
    post:
      tags: [depannage]
      operationId: signalerEnRoute
      summary: L'ambulant qui a pris la demande signale qu'il est en route
      description: |
        La livraison, elle, est enregistrée hors ligne par l'opération `EMISSION_DOCUMENT` portant
        `demandeDepannageId` (RG-D4) ; la demande passe alors à LIVREE.
      x-roles: [AMBULANT]
      parameters:
        - $ref: '#/components/parameters/DemandeId'
      responses:
        '200':
          description: Demande en route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDepannage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- analytique
  /v1/analytique/ruptures:
    get:
      tags: [analytique]
      operationId: lireCarteRuptures
      summary: Carte des ruptures agrégée et anonymisée, sur les produits du grand client connecté (§5.3, §5.4)
      description: |
        Agrégation par cellule geohash. Aucune donnée nominative ni identifiant de hanout ou
        d'ambulant : une cellule qui compte moins de `seuilAnonymat` hanouts distincts n'est
        pas renvoyée. Un `produitId` hors des produits du grand client répond 404.
      x-roles: [GRAND_CLIENT]
      parameters:
        - name: produitId
          in: query
          schema:
            type: string
            format: uuid
        - name: ville
          in: query
          schema:
            type: string
        - name: precision
          in: query
          description: Précision geohash (5 ≈ 4,9 km, 6 ≈ 1,2 km)
          schema:
            type: integer
            enum: [5, 6]
            default: 6
        - $ref: '#/components/parameters/Depuis'
        - $ref: '#/components/parameters/Jusqua'
      responses:
        '200':
          description: Cellules agrégées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarteRuptures'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Taille:
      name: taille
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Lat:
      name: lat
      in: query
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Lon:
      name: lon
      in: query
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    RayonM:
      name: rayonM
      in: query
      description: Rayon en mètres, utilisé seulement avec lat et lon
      schema:
        type: integer
        minimum: 1
        maximum: 50000
        default: 2000
    Depuis:
      name: depuis
      in: query
      description: Borne inférieure incluse
      schema:
        type: string
        format: date-time
    Jusqua:
      name: jusqua
      in: query
      description: Borne supérieure exclue
      schema:
        type: string
        format: date-time
    AppareilId:
      name: appareilId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganisationId:
      name: organisationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UtilisateurId:
      name: utilisateurId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampagneId:
      name: campagneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepotId:
      name: depotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DemandeId:
      name: demandeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Rôle non autorisé (`…/role-non-autorise`), consentement CNDP manquant (`…/consentement-requis`),
        appareil déconnecté à distance (`…/appareil-revoque`) ou compte désactivé (`…/utilisateur-desactive`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            appareilRevoque:
              value:
                type: https://daba.ma/problemes/appareil-revoque
                title: Forbidden
                status: 403
                detail: 'Appareil déconnecté : reconnectez-vous'
            consentementRequis:
              value:
                type: https://daba.ma/problemes/consentement-requis
                title: Forbidden
                status: 403
                detail: Consentement CNDP requis (PUT /v1/moi/consentement)
    AppareilRevoque:
      description: |
        Rôle non autorisé, `appareilId` différent de la session (`…/appareil-different`), ou appareil
        déconnecté à distance (`…/appareil-revoque`, §10, appareil perdu : l'app efface ses données)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            appareilRevoque:
              value:
                type: https://daba.ma/problemes/appareil-revoque
                title: Forbidden
                status: 403
                detail: 'Appareil déconnecté : reconnectez-vous'
    NotFound:
      description: Ressource inexistante ou hors de l'organisation de l'appelant (cloisonnement multi-tenant)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: État incompatible avec l'action (transition interdite, quantité plus disponible, demande déjà prise par un autre ambulant…)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Règle de gestion violée ; `regle` la nomme (ex. RG-P3)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TropDeDemandes:
      description: |
        Trop de demandes (`…/trop-de-demandes`) : attendre le nombre de secondes de `Retry-After` quand
        l'en-tête est présent.
      headers:
        Retry-After:
          description: Secondes avant le prochain essai utile
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MotDePasseRefuse:
      description: |
        Mot de passe refusé (v0.9.0) : `…/mot-de-passe-trop-court` (moins de 15 caractères),
        `…/mot-de-passe-trop-long` (plus de 128), `…/mot-de-passe-telephone` (c'est le numéro de
        téléphone, sous l'une de ses formes), `…/mot-de-passe-courant` (dans la liste des mots de passe
        les plus courants, ou trivial : un motif de 1 à 4 caractères répété, comme `aaaa…` ou `abab…`,
        ou une suite de caractères consécutifs, comme `abcd…` ou `9876…`). Aucune règle de composition (majuscule, chiffre…) n'est imposée.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LienExpire:
      description: Lien signé expiré
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  # Sessions d'exemple, une par rôle, pour le mock Prism (`Prefer: example=<nom>`).
