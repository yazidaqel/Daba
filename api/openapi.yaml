openapi: 3.1.0
info:
  title: Daba API
  version: 0.10.0
  description: |
    Contrat unique entre le back-end, les apps mobiles (ambulant, hanout) et les portails web.
    Changement incompatible = nouvelle version de l'endpoint (/v2/...), jamais de rupture silencieuse.

    **Sessions.** Tout appel authentifié peut répondre 401 (`…/non-authentifie` : jeton expiré, ou
    session fermée par `POST /v1/auth/deconnexion` ; l'app rafraîchit ou redemande l'OTP) ou 403
    `…/appareil-revoque` (appareil déconnecté à distance, §10 : l'app efface ses données locales),
    y compris `POST /v1/auth/refresh` (v0.7.0) : un téléphone perdu dont l'accessToken a expiré
    s'efface aussi au renouvellement. Seul ce `type` autorise l'effacement ; un autre 403 ne doit
    jamais détruire la file hors ligne. La révocation vaut pour cet `appareilId` à jamais : après
    l'effacement, l'app tire un nouvel `appareilId` et la connexion OTP y refonctionne.
    Un compte désactivé par l'administrateur répond 403 `…/utilisateur-desactive` (sur tout appel
    authentifié et à `POST /v1/auth/otp/verify`) : l'app n'efface rien, sa file attend la réactivation.
    Pour le mock Prism, `POST /v1/auth/otp/verify` a un exemple de Session par rôle, à choisir avec
    l'en-tête `Prefer: example=grossiste` (ou ambulant, grandClient, hanout, admin).

    **Connexion aux portails web (v0.9.0, §10).** Les rôles GROSSISTE, GRAND_CLIENT et ADMIN se
    connectent selon la méthode que l'administrateur choisit (`GET`/`PUT /v1/admin/authentification`) :
    `OTP` (code SMS seul, par défaut : rien ne change pour les comptes existants), `MOT_DE_PASSE`
    (téléphone + mot de passe) ou `MOT_DE_PASSE_ET_OTP` (mot de passe puis code SMS). Méthode
    effective = exception de l'organisation, sinon défaut du rôle. AMBULANT et HANOUT (app Flutter,
    PWA) restent sur le code SMS seul, sans mot de passe (§6) : leurs appels ne changent pas.
    Séquences du portail (le portail ne connaît pas la méthode d'un numéro à l'avance : il propose
    « mot de passe » et « recevoir un code », et peut retenir sur le navigateur le dernier choix) :
    - `OTP` : `POST /v1/auth/otp`, puis `POST /v1/auth/otp/verify` → Session (inchangé).
    - `MOT_DE_PASSE` : `POST /v1/auth/mot-de-passe` → `{session}`.
    - `MOT_DE_PASSE_ET_OTP` : `POST /v1/auth/mot-de-passe` → `{defi}` (code envoyé par SMS), puis
      `POST /v1/auth/otp/verify` avec `defi` → Session.
    - Première connexion sans mot de passe, ou mot de passe oublié : `POST /v1/auth/otp`, puis
      `POST /v1/auth/mot-de-passe/definition` (code + nouveau mot de passe) → Session ; toutes les
      autres sessions du compte se ferment. Si le portail a d'abord appelé `POST /v1/auth/otp/verify`,
      la réponse 403 `…/mot-de-passe-a-definir` (ou `…/mot-de-passe-requis`) laisse le code valable
      pour cette définition.
    Aucune réponse avant la preuve d'un secret ne dit si un numéro est inscrit, ni son rôle, ni sa
    méthode : `POST /v1/auth/otp` répond 202 pour tout numéro ; `POST /v1/auth/mot-de-passe` répond le
    même 401 `…/identifiants-invalides`, après le même calcul Argon2id, pour un numéro inconnu, un
    ambulant, un hanout, un compte sans mot de passe ou un mauvais mot de passe, et le
    ralentissement (après 5 échecs consécutifs, attente doublée à chaque échec, de 30 s à 15 min, 429
    `…/trop-de-demandes` avec `Retry-After`) vaut pour tout numéro. Le compte désactivé, l'appareil révoqué ou
    la méthode ne se révèlent qu'après un mot de passe juste ou un code SMS juste.
    Un mot de passe n'est jamais renvoyé, ni journalisé ; il est conservé haché (Argon2id).

    **Tournées, rattachement, péremption (v0.10.0, §3.1, §3.2, §3.3, §3.8, §9).** Ajouts sans rupture :
    opérations `TOURNEE` (tournée planifiée, remplacée en entier) et `VISITE` (visite sans vente),
    entités tirées `TOURNEE` et `VISITE` ; `ProfilAmbulantSaisie.grossisteIds` (rattachement déclaré) ;
    `AmbulantRattache.declare` ; `OffrePromo.rattache` ; ciblage par `Ciblage.zones` et `Ciblage.rayonM`
    appliqué au fil et à la notification ; `ParametresAmbulantSaisie.mentionsLegales: null` efface les
    mentions ; `LigneChargement` (date de péremption et prix d'achat) sur les chargements manuels et
    les bons de sortie, repris dans `Mouvement` et `LigneStock.peremptionProche`.
    Seul assouplissement : `AmbulantRattache.premierBonLe` et `dernierBonLe` deviennent facultatifs
    (absents pour un ambulant rattaché par déclaration, sans bon de sortie reçu).

    **Cloisonnement multi-tenant.** Chaque appel authentifié est cloisonné par l'organisation
    portée par le jeton (`organisationId` de la Session) ; aucun chemin ne prend l'organisation
    en paramètre. Une ressource d'une autre organisation répond 404, comme une ressource inexistante.
    Les seules lectures croisées sont celles du métier, et elles sont limitées aux champs décrits :
    - la marque voit les dépôts de ses campagnes (jamais les ambulants ni les hanouts, §5.4) ;
    - le grossiste voit les réservations faites sur ses dépôts ;
    - l'ambulant voit les offres promo (campagnes et dépôts d'autres organisations), les demandes
      de dépannage qui lui sont proposées et les bons de sortie qui lui sont adressés ;
    - le hanout voit les documents qui lui sont adressés, ses comptes de crédit et leurs relevés.

    **Nom de l'ambulant (CNDP, §5.4).** Partout où un ambulant est désigné (`Reference.nom` d'un
    bon de sortie, d'une réservation, d'un document, d'un compte de crédit ; `AmbulantRattache.nom` ;
    `DemandeDepannage.ambulant.nom`), c'est `ProfilAmbulant.nom`, ou son téléphone masqué
    (`+2126•••••004`) tant qu'il n'a pas de profil ou que son dernier consentement n'a pas
    `traitementDonnees = true` (retrait du consentement : les listes repassent au téléphone masqué).
    Seules les pièces de vente déjà émises (`Document.ambulant.nom`, PDF) gardent le nom figé à leur
    émission (pièce légale, RG-C4). Ce nom n'est montré qu'aux grossistes et aux
    hanouts avec qui l'ambulant travaille ; le texte de consentement de l'ambulant le dit. Aucune
    réponse à un GRAND_CLIENT ne contient de donnée nominative d'un ambulant ou d'un hanout (nom,
    téléphone, gérant, CIN, position) : seulement des agrégats et ses propres grossistes dépositaires.

    **Administration (CNDP, §2, §10).** Les opérations `/v1/admin/*` (tag `administration`) sont
    réservées au rôle ADMIN, c'est-à-dire aux administrateurs de la plateforme chez RED et l'éditeur ;
    tout autre rôle reçoit 403. Elles exposent des données personnelles (téléphone complet, nom,
    organisation, état du consentement, appareils) pour l'onboarding, la modération et le support
    seulement, jamais aux marques ni aux grossistes. Aucune réponse ne contient de code OTP,
    d'accessToken, de refreshToken, de jeton push (seulement `pushActif`), de session ni de secret de
    fournisseur. Chaque écriture (organisation créée, utilisateur ajouté, désactivé ou réactivé,
    appareil révoqué, import du référentiel, configuration des canaux ou de l'authentification,
    mot de passe réinitialisé) est inscrite au journal
    d'audit (`GET /v1/admin/audit`), que la base refuse de modifier ou d'effacer. Les lectures ne
    sont pas journalisées.
    Les recherches (`GET /v1/admin/utilisateurs?q=`, `GET /v1/hanouts?q=`) portent des numéros de
    téléphone dans la query string : le back-end ne journalise aucune URL (pas de journal d'accès,
    pas de détail des requêtes), et tout reverse proxy placé devant (Azure pendant le pilote, VPS
    ensuite) doit journaliser le chemin sans la query string, ou rien.

    **Langues.** Les clients affichent à partir des codes (enums, `Problem.type`, `regle`) ; les
    textes libres renvoyés par le serveur suivent l'en-tête `Accept-Language` (fr, ar, ary-Arab, ary-Latn).
    `x-roles` liste les rôles autorisés ; un autre rôle reçoit 403.

    **Hors ligne.** Toutes les écritures de l'app ambulant passent par `POST /v1/sync/operations`
    (UUID générés par l'appareil, rejouables sans effet de bord), profil compris (`PROFIL_AMBULANT`).
    Seules la réservation d'une promo et les actions de dépannage (disponibilité, acceptation)
    exigent le réseau.

    **Montants** en centimes de dirham (entiers). **Quantités** en unités du produit
    (un produit = un code EAN et un conditionnement).

    **Erreurs** au format RFC 9457 ; `regle` nomme la règle de gestion violée (ex. RG-P3).

    **Notifications push (FCM).** Chaque push porte un titre et un texte dans la langue de l'appareil
    (`JetonPush.langue`) et des `data` (chaînes) : `type` (`TypeMessage`) et `cibleId`, l'objet à
    ouvrir : demande de dépannage (RUPTURE_SIGNALEE, DEMANDE_*), dépôt (PROPOSITION_DEPOT,
    PROMO_CONFIRMEE : `OffrePromo.depotId`), réservation (RESERVATION_EXPIRE_BIENTOT,
    RETRAIT_EFFECTUE), document (DOCUMENT_EMIS, RECEPTION_ECART), contestation (CONTESTATION).
    Sur Android, `android.notification.channel_id` suit la priorité du tableau §9 (canaux créés par
    l'app) : `haute` avec la priorité FCM HIGH pour RUPTURE_SIGNALEE, DEMANDE_ACCEPTEE,
    DEMANDE_EN_ROUTE, DEMANDE_LIVREE, PROMO_CONFIRMEE, RESERVATION_EXPIRE_BIENTOT, PROPOSITION_DEPOT
    (et OTP) ; `moyenne` (NORMAL) pour DEMANDE_SANS_REPONSE, RETRAIT_EFFECTUE, DOCUMENT_EMIS et,
    hors tableau, DEMANDE_PRISE, RECEPTION_ECART, CONTESTATION ; `basse` (NORMAL) réservé aux
    alertes de stock embarqué (aucun type encore).
    Le texte d'un push s'affiche sur l'écran verrouillé, hors du code PIN de l'app : il ne contient
    jamais de nom ni de téléphone d'un hanout ou d'un ambulant, ni de lien signé (CNDP) ; l'app
    ouvre le détail depuis `cibleId`. Les SMS gardent leur texte complet. Un appareil dont la
    session est fermée (`POST /v1/auth/deconnexion`) ne reçoit plus de push jusqu'à sa prochaine
    connexion par OTP et un nouvel envoi de son jeton.
    Un jeton refusé par FCM (UNREGISTERED, ou INVALID_ARGUMENT sur le jeton) est effacé de
    l'appareil : l'app le renvoie par `PUT /v1/appareils/{appareilId}/push` à chaque démarrage et
    à chaque rotation du jeton.
  license:
    name: Propriétaire
    identifier: LicenseRef-Daba-Proprietaire
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

tags:
  - name: comptes
    description: Authentification OTP et, pour les portails web, par mot de passe ; appareils, liens signés
  - name: referentiel
    description: Hanouts (base POS RED), produits, grossistes
  - name: sync
    description: Synchronisation de l'app ambulant hors ligne
  - name: stock
    description: Stock embarqué, mouvements (RG-S*), bons de sortie
  - name: ventes
    description: Bons de livraison, factures, avoirs, versements, karni (RG-C*, RG-F*)
  - name: promos
    description: Campagnes, dépôts, réservations, retraits (§7.2, RG-P*)
  - name: depannage
    description: Ruptures signalées par les hanouts et dispatch (§7.1, RG-D*)
  - name: analytique
    description: Données agrégées et anonymisées pour les grands clients (§5.4)
  - name: canaux
    description: Couche canaux (push, SMS, WhatsApp) paramétrée par l'administrateur (§9)
  - name: administration
    description: Back-office RED / éditeur (§2) — organisations, utilisateurs, appareils, journal d'audit (§10)

paths:
  # ---------------------------------------------------------------- comptes
  /v1/auth/otp:
    post:
      tags: [comptes]
      operationId: demanderOtp
      summary: Envoie un code OTP par SMS au numéro donné, ou au numéro d'un lien signé
      description: |
        Chaque code remplace le précédent (5 essais, 5 min). Au-delà de 5 codes par heure et par numéro,
        429 sans rien changer : le code en cours et ses essais déjà comptés restent tels quels.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code envoyé (réponse identique que le numéro soit connu ou non)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '400':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/LienExpire'
        '429':
          $ref: '#/components/responses/Problem'

  /v1/auth/otp/verify:
    post:
      tags: [comptes]
      operationId: verifierOtp
      summary: Vérifie le code OTP et ouvre une session sur l'appareil
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Code valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                ambulant:
                  $ref: '#/components/examples/SessionAmbulant'
                grossiste:
                  $ref: '#/components/examples/SessionGrossiste'
                grandClient:
                  $ref: '#/components/examples/SessionGrandClient'
                hanout:
                  $ref: '#/components/examples/SessionHanout'
                admin:
                  $ref: '#/components/examples/SessionAdmin'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: |
            Code juste, mais : compte désactivé par l'administrateur (`…/utilisateur-desactive`) ; ou
            compte de portail dont la méthode exige un mot de passe (v0.9.0) : `…/mot-de-passe-a-definir`
            (aucun mot de passe encore : `POST /v1/auth/mot-de-passe/definition` avec ce même code),
            `…/mot-de-passe-requis` (méthode MOT_DE_PASSE, ou MOT_DE_PASSE_ET_OTP sans `defi` valable :
            `POST /v1/auth/mot-de-passe`, ou nouveau mot de passe par définition avec ce code). Dans ces
            deux cas le code n'est pas consommé. Jamais pour AMBULANT ni HANOUT.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/LienExpire'
        '429':
          $ref: '#/components/responses/Problem'

  /v1/auth/refresh:
    post:
      tags: [comptes]
      operationId: rafraichirSession
      summary: Renouvelle la session de l'appareil avec le refreshToken (valable 90 jours)
      description: |
        L'accessToken vaut 24 h ; l'app le renouvelle ici, sans nouvel OTP, tant que l'appareil
        n'est pas déconnecté à distance. 401 si le refreshToken est invalide, ou si la session a été
        fermée (déconnexion, nouvelle connexion, compte désactivé). 403 `…/appareil-revoque` (v0.7.0,
        avant : 401) si l'appareil a été révoqué : l'app efface ses données locales.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nouvelle session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AppareilRevoque'

  /v1/auth/deconnexion:
    post:
      tags: [comptes]
      operationId: seDeconnecter
      summary: Ferme la session de l'appareil connecté côté serveur
      description: |
        L'accessToken et le refreshToken de cette session deviennent invalides (401 ensuite) et
        l'appareil ne reçoit plus de push. Ce n'est pas une révocation : une nouvelle connexion OTP
        sur le même appareil reste possible. Permis sans consentement CNDP. L'app ambulant pousse
        d'abord sa file (`POST /v1/sync/operations`) : sinon les opérations restent sur le téléphone
        et un autre ambulant qui s'y connecte ne pourra pas les rejouer.
        De même, chaque connexion OTP ouvre une nouvelle session sur l'appareil : les jetons de la
        précédente ne valent plus (seuls ceux de la dernière Session reçue servent).
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT, ADMIN]
      responses:
        '204':
          description: Session fermée
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/mot-de-passe:
    post:
      tags: [comptes]
      operationId: connecterParMotDePasse
      summary: Connexion d'un portail web par téléphone et mot de passe (GROSSISTE, GRAND_CLIENT, ADMIN)
      description: |
        Méthode `MOT_DE_PASSE` : renvoie la Session. Méthode `MOT_DE_PASSE_ET_OTP` : envoie un code par
        SMS (mêmes limites que `POST /v1/auth/otp`) et renvoie un `defi` à joindre au code dans
        `POST /v1/auth/otp/verify`. Le défi vaut 5 min, pour cet `appareilId` et pour le seul code qu'il a
        fait envoyer : il est consommé avec lui, et devient caduc dès qu'un autre code est demandé pour ce
        numéro (nouveau défi ou `POST /v1/auth/otp`) ou que le mot de passe change. Au-delà de 5 codes
        par heure, 429 sans rien changer : le code en cours garde ses essais déjà comptés.
        401 `…/identifiants-invalides` identique pour un numéro inconnu, un ambulant, un hanout, un
        compte sans mot de passe ou un mauvais mot de passe (même calcul Argon2id dans tous les cas).
        Ralentissement, pour tout numéro : les 5 premiers échecs consécutifs sont libres, puis chaque
        essai attend une durée qui double à chaque échec (30 s, 1 min, 2 min… jusqu'à 15 min) : avant,
        429 `…/trop-de-demandes` avec `Retry-After` (secondes) ; après l'attente, un mot de passe juste
        passe. Un navigateur (`appareilId`) où le compte s'est déjà connecté a son propre compteur :
        quelqu'un qui multiplie les échecs sur un numéro ne ralentit pas le navigateur habituel de son
        titulaire. Une connexion réussie remet le compteur de ce navigateur à zéro ; une définition par
        code SMS ou une réinitialisation par l'administrateur remet tous ceux du numéro à zéro.
        Serveur saturé de calculs de mot de passe : 429 `…/trop-de-demandes` avec `Retry-After: 1`, pour
        tous, sans compter d'échec. Après un mot de passe juste seulement : 403 `…/connexion-par-code`
        (méthode OTP : passer par `POST /v1/auth/otp`), 403 `…/utilisateur-desactive`, 401
        `…/appareil-revoque`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionMotDePasseSaisie'
      responses:
        '200':
          description: Session ouverte, ou défi en attente du code SMS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnexionMotDePasse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Identifiants invalides (`…/identifiants-invalides`), ou appareil révoqué (`…/appareil-revoque`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Mot de passe juste, mais méthode OTP (`…/connexion-par-code`) ou compte désactivé (`…/utilisateur-desactive`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TropDeDemandes'

  /v1/auth/mot-de-passe/definition:
    post:
      tags: [comptes]
      operationId: definirMotDePasse
      summary: Définit le mot de passe après un code SMS (première connexion ou mot de passe oublié)
      description: |
        Le code vient de `POST /v1/auth/otp` (ou est celui qu'un 403 `…/mot-de-passe-a-definir` ou
        `…/mot-de-passe-requis` de `POST /v1/auth/otp/verify` a laissé valable). Le mot de passe est
        contrôlé avant le code (422 : le code n'est pas consommé). Code juste : le mot de passe remplace
        l'ancien, toutes les sessions du compte se ferment (tous appareils), le ralentissement du numéro
        est levé, et une Session s'ouvre sur cet appareil, quelle que soit la méthode du compte. Inscrit au
        journal d'audit (MOT_DE_PASSE_DEFINI). Un numéro d'administrateur (`DABA_ADMIN_TELEPHONES`) qui
        ne s'est jamais connecté est inscrit ici.
        403 `…/mot-de-passe-non-applicable` si le numéro n'a pas de compte de portail (inconnu,
        ambulant, hanout) : seul le détenteur du code l'apprend.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionMotDePasse'
      responses:
        '200':
          description: Mot de passe enregistré, session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Code invalide ou expiré (`…/code-invalide`), ou appareil révoqué (`…/appareil-revoque`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Pas de compte de portail à ce numéro (`…/mot-de-passe-non-applicable`), ou compte désactivé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/MotDePasseRefuse'
        '429':
          $ref: '#/components/responses/TropDeDemandes'

  /v1/moi/mot-de-passe:
    put:
      tags: [comptes]
      operationId: changerMotDePasse
      summary: Change le mot de passe de l'utilisateur connecté (mot de passe actuel exigé)
      description: |
        Les autres sessions du compte se ferment ; celle de l'appel reste ouverte. Un mot de passe
        actuel faux répond 403 `…/identifiants-invalides` et compte dans le ralentissement du numéro
        (`POST /v1/auth/mot-de-passe`). Sans mot de passe encore : 409 `…/mot-de-passe-absent` (passer par
        `POST /v1/auth/mot-de-passe/definition`). Permis sans consentement CNDP. Inscrit au journal
        d'audit (MOT_DE_PASSE_MODIFIE).
      x-roles: [GROSSISTE, GRAND_CLIENT, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangementMotDePasse'
      responses:
        '204':
          description: Mot de passe changé
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Mot de passe actuel faux (`…/identifiants-invalides`), ou rôle non autorisé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Aucun mot de passe défini (`…/mot-de-passe-absent`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/MotDePasseRefuse'
        '429':
          $ref: '#/components/responses/TropDeDemandes'

  /v1/liens/{jeton}:
    get:
      tags: [comptes]
      operationId: ouvrirLien
      summary: Résout un lien hanout signé reçu par SMS (sans authentification)
      description: |
        Le lien est signé et à durée limitée. Il ne donne accès à aucune donnée :
        il indique seulement la cible, que la PWA affiche après connexion OTP
        (`POST /v1/auth/otp` avec `lienJeton`).
      security: []
      parameters:
        - name: jeton
          in: path
          required: true
          schema:
            type: string
            minLength: 16
      responses:
        '200':
          description: Lien valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LienCible'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/LienExpire'

  /v1/appareils/{appareilId}/push:
    put:
      tags: [comptes]
      operationId: enregistrerJetonPush
      summary: Enregistre ou remplace le jeton push de l'appareil connecté
      x-roles: [AMBULANT, HANOUT, GROSSISTE]
