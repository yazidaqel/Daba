  /v1/campagnes/{campagneId}/depots:
    post:
      tags: [promos]
      operationId: proposerDepot
      summary: Propose un dépôt à un grossiste (répartition des quantités, §5.2)
      description: |
        Passe la campagne de BROUILLON à PROPOSEE au premier appel. Possible tant que la campagne
        n'est ni expirée ni clôturée. La somme des quantités proposées ne dépasse pas la quantité
        totale de chaque ligne (422). Le grossiste reçoit une notification push + e-mail.
      x-roles: [GRAND_CLIENT]
      parameters:
        - $ref: '#/components/parameters/CampagneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropositionDepot'
      responses:
        '201':
          description: Dépôt proposé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Depot'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [promos]
      operationId: listerDepotsCampagne
      summary: Suivi des acceptations et réceptions par grossiste
