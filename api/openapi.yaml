      description: Quantités agrégées ; aucune donnée nominative sur les ambulants ni les hanouts (§5.4).
      x-roles: [GRAND_CLIENT]
      parameters:
        - $ref: '#/components/parameters/CampagneId'
      responses:
        '200':
          description: Entonnoir
          content:
            application/json:
