        - $ref: '#/components/parameters/AppareilId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JetonPush'
      responses:
        '204':
          description: Jeton enregistré
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/moi/consentement:
    get:
      tags: [comptes]
      operationId: lireConsentement
      summary: Consentement CNDP de l'utilisateur connecté (loi 09-08)
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT]
      responses:
        '200':
          description: Dernier consentement enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [comptes]
      operationId: enregistrerConsentement
      summary: Enregistre ou retire le consentement (journalisé, horodaté, avec la version du texte)
      description: |
        Tant que le dernier consentement enregistré n'a pas `traitementDonnees = true`, toute
        opération authentifiée répond 403 (Problem `type` …/consentement-requis, quelle que soit
        la connexion), sauf `GET`/`PUT /v1/moi/consentement`, `GET /v1/moi/donnees` (droit d'accès)
        et `POST /v1/sync/operations` : les pièces de vente déjà émises doivent pouvoir remonter
        (obligation légale de conservation, RG-C4). Sans ce consentement, seules y sont appliquées
        EMISSION_DOCUMENT, AVOIR, VERSEMENT, le stock qu'elles mouvementent (CHARGEMENT, RETOUR,
        INVENTAIRE) et HANOUT (hanout terrain qu'elles référencent) ; les autres (PROFIL_AMBULANT,
        PARAMETRES_AMBULANT, TARIF, CREDIT_HANOUT, RESOLUTION_CONTESTATION) sont REJETEE avec
        `erreur.type` …/consentement-requis, à renvoyer une fois le consentement donné.
        Retirer `geolocalisation` coupe la disponibilité de l'ambulant et efface sa dernière position.
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentementSaisie'
      responses:
        '200':
          description: Consentement enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consentement'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/moi/donnees:
    get:
      tags: [comptes]
      operationId: exporterMesDonnees
      summary: Droit d'accès (loi 09-08) — export des données personnelles de l'utilisateur connecté
      x-roles: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT]
      responses:
        '200':
          description: |
            Export JSON (profil, consentements, appareils, positions conservées). `utilisateur` porte
            `mot_de_passe_defini` et `mot_de_passe_modifie_le` (v0.9.0), jamais l'empreinte du mot de passe.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/organisations:
    get:
      tags: [administration]
      operationId: listerOrganisations
      summary: Liste les grossistes et les grands clients inscrits (back-office)
      description: |
        Seules les organisations GROSSISTE et GRAND_CLIENT sont listées ; les ambulants, hanouts et
        administrateurs ont chacun leur organisation personnelle, qu'on retrouve par
        `GET /v1/admin/utilisateurs`. Tri par nom.
      x-roles: [ADMIN]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [GROSSISTE, GRAND_CLIENT]
        - name: q
          in: query
          description: Partie du nom de l'organisation (sans casse)
          schema:
            type: string
            minLength: 2
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page d'organisations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationAdminPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [administration]
      operationId: creerOrganisation
      summary: L'administrateur inscrit un grossiste ou un grand client et ses utilisateurs
      description: |
        Les ambulants s'inscrivent seuls par OTP ; un numéro présent dans la base POS devient un
        compte HANOUT à sa première connexion. Grossistes et grands clients sont créés ici ; leurs
        utilisateurs se connectent ensuite par OTP. 409 si un numéro est déjà inscrit. Inscrit au
        journal d'audit (ORGANISATION_CREEE, v0.7.0).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationSaisie'
      responses:
        '201':
          description: Organisation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreee'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/organisations/{organisationId}:
    get:
      tags: [administration]
      operationId: lireOrganisation
      summary: Détail d'une organisation et de ses utilisateurs (back-office)
      description: |
        Toute organisation, y compris l'organisation personnelle d'un ambulant, d'un hanout ou d'un
        administrateur (`UtilisateurAdmin.organisation.id`).
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: Organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/organisations/{organisationId}/utilisateurs:
    post:
      tags: [administration]
      operationId: ajouterUtilisateurOrganisation
      summary: Ajoute un utilisateur à un grossiste ou à un grand client existant
      description: |
        L'utilisateur prend le rôle de l'organisation (GROSSISTE ou GRAND_CLIENT) et se connecte
        ensuite par OTP ; aucun SMS ne part à l'ajout. 409 si le numéro est déjà inscrit (quel que
        soit le rôle), ou si l'organisation n'est ni un grossiste ni un grand client (les
        organisations personnelles n'ont qu'un utilisateur, et les administrateurs viennent de la
        configuration du serveur). Inscrit au journal d'audit (UTILISATEUR_AJOUTE).
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganisationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembreSaisie'
      responses:
        '201':
          description: Utilisateur ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurAdmin'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/utilisateurs:
    get:
      tags: [administration]
      operationId: chercherUtilisateurs
      summary: Recherche d'utilisateurs, tous rôles (support)
      description: |
        `q` cherche dans le téléphone (chiffres, sous toute forme : 0612…, 212612…, +212612…, ou une
        partie), dans le nom de l'utilisateur et dans celui de son organisation. Chaque résultat
        porte ses rôles, son organisation, son dernier consentement CNDP et ses appareils. Tri du
        plus récent au plus ancien inscrit.
      x-roles: [ADMIN]
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
        - name: role
          in: query
          schema:
            type: string
            enum: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT, ADMIN]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page d'utilisateurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurAdminPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/utilisateurs/{utilisateurId}/desactivation:
    post:
      tags: [administration]
      operationId: desactiverUtilisateur
      summary: Désactive un compte (modération) ; ses sessions se ferment
      description: |
        Toutes les sessions de l'utilisateur se ferment, ses jetons push sont effacés, sa
        disponibilité de dépannage est coupée, il n'est plus ciblé par les notifications (promos,
        propositions de dépôt) et ne peut plus se connecter : `POST /v1/auth/otp/verify` répond 403
        `…/utilisateur-desactive`. Rien n'est effacé : ses pièces, son karni et la file hors ligne de
        son téléphone attendent une réactivation. Un administrateur ne peut pas se désactiver
        lui-même (409). Sans effet sur un compte déjà désactivé. Inscrit au journal d'audit
        (UTILISATEUR_DESACTIVE).
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UtilisateurId'
      responses:
        '200':
          description: Utilisateur désactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/utilisateurs/{utilisateurId}/reactivation:
    post:
      tags: [administration]
      operationId: reactiverUtilisateur
      summary: Réactive un compte désactivé ; l'utilisateur se reconnecte par OTP
      description: |
        Les sessions fermées ne se rouvrent pas : l'utilisateur repasse par l'OTP, et un ambulant
        réactive lui-même sa disponibilité. Sans effet sur un compte actif. Inscrit au journal
        d'audit (UTILISATEUR_REACTIVE).
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UtilisateurId'
      responses:
        '200':
          description: Utilisateur actif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/utilisateurs/{utilisateurId}/reinitialisation-mot-de-passe:
    post:
      tags: [administration]
      operationId: reinitialiserMotDePasse
      summary: Efface le mot de passe d'un utilisateur de portail et ferme toutes ses sessions
      description: |
        L'utilisateur redéfinit un mot de passe par code SMS à sa prochaine connexion
        (`POST /v1/auth/mot-de-passe/definition`) si sa méthode en exige un. Le ralentissement de son
        numéro est levé. 409 pour un AMBULANT ou un HANOUT (jamais de mot de passe). Inscrit au journal
        d'audit (MOT_DE_PASSE_REINITIALISE).
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UtilisateurId'
      responses:
        '200':
          description: Mot de passe effacé, sessions fermées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/authentification:
    get:
      tags: [administration]
      operationId: lireConfigurationAuthentification
      summary: Méthode de connexion des portails web, par rôle et par organisation (§10)
      description: |
        Configuration en vigueur : les trois rôles de portail sont toujours listés (OTP pour un rôle
        jamais enregistré), suivis des exceptions par organisation.
      x-roles: [ADMIN]
      responses:
        '200':
          description: Configuration effective
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationAuthentification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [administration]
      operationId: modifierConfigurationAuthentification
      summary: Choisit la méthode de connexion par rôle de portail et par organisation
      description: |
        Remplace la configuration ; un rôle absent repasse à OTP. Les exceptions ne visent que des
        organisations GROSSISTE ou GRAND_CLIENT existantes (400 sinon, comme pour un rôle ou une
        organisation en double) ; AMBULANT et HANOUT ne sont pas configurables (400). Les sessions
        ouvertes restent ouvertes, celle de l'administrateur qui enregistre comprise : la méthode
        s'applique à la connexion suivante, et un compte sans mot de passe le définit alors par code
        SMS. Avec `fermerSessions: true`, les sessions ouvertes de chaque compte dont la méthode effective
        devient plus stricte (elle exige un facteur que l'ancienne n'exigeait pas : OTP → MOT_DE_PASSE,
        OTP ou MOT_DE_PASSE → MOT_DE_PASSE_ET_OTP, MOT_DE_PASSE → OTP) se ferment, sauf la session de
        l'administrateur qui enregistre ; ces comptes se reconnectent avec la nouvelle méthode.
        Aucune configuration ne bloque les administrateurs : le SMS ne peut pas être coupé pour les
        codes (`PUT /v1/admin/canaux`) et chaque méthode garde la définition par code SMS. Inscrit au
        journal d'audit (CONFIGURATION_AUTHENTIFICATION, avec `fermerSessions` et `sessionsFermees` :
        identifiants des comptes concernés).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationAuthentification'
      responses:
        '200':
          description: Configuration effective après enregistrement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationAuthentification'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/appareils/{appareilId}/revocation:
    post:
      tags: [administration]
      operationId: revoquerAppareil
      summary: Déconnexion à distance d'un appareil perdu ou volé (§10)
      description: |
        L'appareil est révoqué, définitivement pour cet `appareilId` : sa session se ferme, son jeton
        push est effacé, et son prochain appel (`POST /v1/sync/operations`, `POST /v1/auth/refresh`
        ou tout autre) répond 403 `…/appareil-revoque`, sur quoi l'app efface ses données locales.
        Les opérations hors ligne pas encore synchronisées sur ce téléphone sont perdues. Une
        connexion OTP sur un autre appareil (ou après effacement, avec un nouvel `appareilId`)
        fonctionne, avec un nouveau préfixe de numérotation (RG-F1). La disponibilité de dépannage
        de l'utilisateur est coupée (sa dernière position venait peut-être de ce téléphone). Sans
        effet sur un appareil déjà révoqué. Inscrit au journal d'audit (APPAREIL_REVOQUE, avec
        `utilisateurIds` : tous les comptes de l'appareil).
        La révocation vise l'appareil physique, pas un compte (v0.8.0) : un téléphone partagé par
        plusieurs comptes s'efface pour tous, et aucun d'eux ne peut plus s'y reconnecter. Seul le
        compte courant (`compteActuel`) y avait une session ; c'est sa disponibilité qui est coupée.
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AppareilId'
      responses:
        '200':
          description: |
            Appareil révoqué ; renvoie son compte courant, avec tous ses appareils ; l'entrée de cet
            appareil liste dans `autresComptes` les autres comptes touchés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/audit:
    get:
      tags: [administration]
      operationId: lireJournalAudit
      summary: Journal d'audit des opérations sensibles (§10), en lecture seule
      description: |
        Du plus récent au plus ancien. Le journal est en ajout seul : la base refuse toute
        modification ou suppression, et l'API n'offre aucune écriture.
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Depuis'
        - $ref: '#/components/parameters/Jusqua'
        - name: auteurId
          in: query
          description: Utilisateur qui a fait l'opération
          schema:
            type: string
            format: uuid
        - name: operation
          in: query
          schema:
            $ref: '#/components/schemas/OperationAudit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Taille'
      responses:
        '200':
          description: Page d'entrées du journal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntreeAuditPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/canaux:
    get:
      tags: [canaux]
      operationId: lireConfigurationCanaux
      summary: Configuration effective des canaux de notification (§9, « Canaux configurables »)
      description: |
        Configuration en vigueur : ce qui a été enregistré par `PUT`, complété par les valeurs par
        défaut du serveur (tableau §9 du pilote) pour tout ce qui n'a pas été enregistré. Pour
        chaque canal, `fournisseursDisponibles` liste les fournisseurs de ce serveur et dit si leurs
        identifiants sont configurés. Aucun secret (clé d'API, compte de service) n'est jamais
        renvoyé : ils viennent des variables d'environnement ou de fichiers montés du serveur.
        Fournisseur par défaut d'un canal : le vrai opérateur s'il est configuré, sinon JOURNAL.
        La base URL Infobip doit être en HTTPS (la clé part dans l'en-tête), sinon Infobip est
        présenté comme non configuré.
      x-roles: [ADMIN]
      responses:
        '200':
          description: Configuration effective
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationCanaux'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [canaux]
      operationId: modifierConfigurationCanaux
      summary: Active ou coupe les canaux, choisit les fournisseurs et le routage par type de message
      description: |
        Remplace la configuration enregistrée ; prise en compte dès l'envoi suivant, sans
        redémarrage ni développement. Un canal, un type de message ou une organisation absent de la
        requête reprend la valeur par défaut du serveur. Un message part par le canal `principal`,
        puis par le canal `repli` si le principal échoue, refuse le message, est coupé (au niveau du
        système, du type de message ou de l'organisation du destinataire) ou si le destinataire n'y
        est pas joignable (aucun jeton push, aucun téléphone).
        Un fournisseur dont les identifiants ne sont pas configurés sur le serveur ne peut pas être
        choisi (422, `type` …/fournisseur-non-configure) ; JOURNAL (messages écrits dans les logs) ne
        peut plus l'être pour un canal dont un vrai fournisseur est configuré (422, `type`
        …/journal-interdit). Dès qu'un vrai fournisseur est configuré sur le serveur, JOURNAL n'écrit
        plus que le type de message et le numéro masqué.
        L'OTP part seulement par SMS (`principal` SMS, sans `repli`, SMS absent de `inactifs`) et le
        SMS ne peut pas être coupé au niveau du système : sinon personne, administrateur compris, ne
        pourrait se connecter (400). La coupure par organisation ne s'applique pas à l'OTP. Une
        `organisationId` inconnue répond 400.
        Opération sensible inscrite au journal d'audit (auteur, date, configuration enregistrée),
        que la base refuse de modifier ou d'effacer.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationCanaux'
      responses:
        '200':
          description: Configuration effective après enregistrement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationCanaux'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Fournisseur non configuré sur ce serveur (`type` …/fournisseur-non-configure), ou JOURNAL
            choisi alors qu'un vrai fournisseur du canal est configuré (`type` …/journal-interdit)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/photos/{photoId}:
    get:
      tags: [comptes]
      operationId: lirePhoto
      summary: Photo envoyée par un utilisateur (bon de livraison d'un dépôt, rupture signalée en photo)
      description: |
        Cible des champs `photoBonLivraisonUrl` et `photoUrl`. Identifiant non devinable,
        réservé aux utilisateurs connectés.
