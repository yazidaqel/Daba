      summary: Le grossiste clôture son dépôt et déclare le sort du reliquat (retourné ou racheté)
      description: |
        Seulement pour un dépôt RECU dont la campagne est EPUISEE ou EXPIREE (sinon 409) : le
        portail lit `Depot.statutCampagne` pour ne proposer la clôture qu'à ce moment. La campagne
        passe à CLOTUREE quand tous ses dépôts reçus sont clôturés.
      x-roles: [GROSSISTE]
