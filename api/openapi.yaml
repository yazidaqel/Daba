  /v1/depots/{depotId}/reception:
    post:
      tags: [promos]
      operationId: confirmerReception
      summary: Le grossiste confirme la réception physique (quantités reçues, photo du bon de livraison)
      description: |
        Pivot du flux promo (§7.2, RG-P1) : le dépôt passe à RECU, la campagne à ACTIVE si c'est
        le premier dépôt confirmé, et les ambulants ciblés sont notifiés (moins de 2 minutes, §10).
        Si la campagne n'a pas encore commencé, l'offre est publiée et notifiée à son début.
        Seulement à l'état ACCEPTE (sinon 409).
      x-roles: [GROSSISTE]
      parameters:
        - $ref: '#/components/parameters/DepotId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reception, photoBonLivraison]
              properties:
                reception:
                  $ref: '#/components/schemas/ReceptionDepot'
                photoBonLivraison:
                  type: string
                  contentMediaType: image/jpeg
            encoding:
              reception:
                contentType: application/json
              photoBonLivraison:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Réception confirmée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Depot'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/Problem'

