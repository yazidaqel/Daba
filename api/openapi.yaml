  schemas:
    # ------------------------------------------------------------ communs
    Telephone:
      type: string
      description: Numéro marocain au format E.164
      pattern: '^\+212[5-7][0-9]{8}$'
      examples: ['+212612345678']

    Langue:
      type: string
      enum: [fr, ar, ary-Arab, ary-Latn]
      description: fr, arabe (RTL), darija en caractères arabes ou latins

    LibelleI18n:
      type: object
      description: Libellé dans chaque langue de l'interface ; `fr` toujours présent, les autres retombent sur `fr`
      required: [fr]
      properties:
        fr:
          type: string
        ar:
          type: string
        ary-Arab:
          type: string
        ary-Latn:
          type: string

    Montant:
      type: integer
      format: int64
      description: Montant en centimes de dirham (MAD) ; les prix de vente sont TTC
      examples: [12550]

    TauxTva:
      type: number
      enum: [0, 7, 10, 14, 20]
      description: |
        Taux de TVA du produit, en pour cent ; absent = inconnu. Les prix étant TTC, la TVA d'une
        ligne de montant M au taux t vaut M × t / (100 + t), arrondie au centime (demi au-dessus,
        en valeur absolue), et celle d'un document est la somme de ses lignes (RG-F2).

    Ean:
      type: string
      pattern: '^[0-9]{8}$|^[0-9]{13}$'

    Position:
      type: object
      description: Position WGS 84
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          examples: [33.5731]
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          examples: [-7.5898]
      examples:
        - lat: 33.5731
          lon: -7.5898

    ZoneGeo:
      type: object
      description: Polygone GeoJSON (RFC 7946), coordonnées [lon, lat]
      required: [type, coordinates]
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number

    PageMeta:
      type: object
      required: [page, taille, total]
      properties:
        page:
          type: integer
        taille:
          type: integer
        total:
          type: integer
          format: int64

    Reference:
      type: object
      description: |
        Référence courte vers un acteur, pour l'affichage. Pour un ambulant, `nom` est
        `ProfilAmbulant.nom`, ou son téléphone masqué tant qu'il n'a pas de profil.
      required: [id, nom]
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            `https://daba.ma/problemes/<code>` ; codes fixes (les clients décident sur ce code, jamais sur `detail`) :
            - `requete-invalide` (400, détail par champ dans `erreurs`)
            - `non-authentifie` (401 : jeton absent, invalide, expiré, ou session fermée)
            - `code-invalide` (401, OTP faux ou expiré)
            - `identifiants-invalides` (401 à `POST /v1/auth/mot-de-passe`, 403 à `PUT /v1/moi/mot-de-passe`)
            - `mot-de-passe-requis`, `mot-de-passe-a-definir` (403 à `POST /v1/auth/otp/verify`, portails)
            - `connexion-par-code`, `mot-de-passe-non-applicable` (403)
            - `mot-de-passe-absent` (409)
            - `mot-de-passe-trop-court`, `mot-de-passe-trop-long`, `mot-de-passe-telephone`,
              `mot-de-passe-courant` (422)
            - `appareil-revoque` (403 sur tout appel authentifié et à `POST /v1/auth/refresh`, 401 à
              `POST /v1/auth/otp/verify`, `POST /v1/auth/mot-de-passe` et `POST /v1/auth/mot-de-passe/definition` :
              appareil déconnecté à distance, l'app efface ses données locales)
            - `utilisateur-desactive` (403 sur tout appel authentifié et à `POST /v1/auth/otp/verify` :
              compte désactivé par l'administrateur ; rien n'est effacé)
            - `consentement-requis` (403 : consentement CNDP à recueillir, `PUT /v1/moi/consentement`)
            - `role-non-autorise` (403)
            - `appareil-different` (403 : `appareilId` du corps différent de celui de la session)
            - `introuvable` (404, y compris hors de l'organisation de l'appelant)
            - `conflit` (409)
            - `lien-expire`, `curseur-expire` (410)
            - `regle-de-gestion` (422, `regle` nomme la règle)
            - `trop-de-demandes` (429)
            - `erreur-serveur` (dans `ResultatOperation.erreur` seulement : renvoyer l'opération plus tard)
          examples: [https://daba.ma/problemes/appareil-revoque]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        regle:
          type: string
          description: Règle de gestion du cahier des charges en cause
          examples: [RG-P3]
        erreurs:
          type: array
          description: Erreurs de validation champ par champ
          items:
            type: object
            required: [champ, message]
            properties:
              champ:
                type: string
              message:
                type: string

    # ------------------------------------------------------------ comptes
    OtpRequest:
      type: object
      description: Un numéro, ou le jeton d'un lien hanout signé (le code part alors au numéro du lien)
      anyOf:
        - required: [telephone]
        - required: [lienJeton]
      properties:
        telephone:
          $ref: '#/components/schemas/Telephone'
        lienJeton:
          type: string
        langue:
          $ref: '#/components/schemas/Langue'

    OtpSent:
      type: object
      required: [expireDans]
      properties:
        expireDans:
          type: integer
          description: Durée de validité du code, en secondes
          examples: [300]

    OtpVerify:
      type: object
      required: [code, appareilId]
      anyOf:
        - required: [telephone]
        - required: [lienJeton]
      properties:
        telephone:
          $ref: '#/components/schemas/Telephone'
        lienJeton:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
        appareilId:
          type: string
          format: uuid
          description: UUID généré par l'appareil ; identifie l'appareil dans les mouvements (RG-S2) et la synchronisation
        defi:
          type: string
          description: |
            Portails, méthode MOT_DE_PASSE_ET_OTP (v0.9.0) : `ConnexionMotDePasse.defi` reçu après le mot
            de passe, avec le même `appareilId` et le code que ce défi a fait envoyer (un défi plus ancien
            ou un autre code ne vaut pas). Consommé avec le code. Ignoré pour un compte en méthode OTP.

    MethodeConnexion:
      type: string
      description: |
        Connexion d'un portail web (v0.9.0) : OTP (code SMS seul), MOT_DE_PASSE (téléphone + mot de
        passe), MOT_DE_PASSE_ET_OTP (mot de passe puis code SMS). Toujours OTP pour AMBULANT et HANOUT.
      enum: [OTP, MOT_DE_PASSE, MOT_DE_PASSE_ET_OTP]

    MotDePasse:
      type: string
      format: password
      writeOnly: true
      description: |
        15 à 128 caractères pour toutes les méthodes (normalisés NFC, un point de code = un caractère,
        niveau NIST SP 800-63B rév. 4 d'un mot de passe seul facteur), tout caractère permis,
        espaces et arabe compris, sans règle de composition ; refusé s'il est le numéro de téléphone
        ou l'un des mots de passe les plus courants (422). Jamais renvoyé ni journalisé.
      minLength: 15
      maxLength: 128

    ConnexionMotDePasseSaisie:
      type: object
      required: [telephone, motDePasse, appareilId]
      properties:
        telephone:
          $ref: '#/components/schemas/Telephone'
        motDePasse:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
          description: Seulement comparé (la politique ne s'applique qu'à la définition)
        appareilId:
          type: string
          format: uuid
          description: UUID de l'appareil (navigateur) qui ouvre la session
        langue:
          $ref: '#/components/schemas/Langue'

    ConnexionMotDePasse:
      type: object
      description: Exactement l'un des deux, selon la méthode du compte
      properties:
        session:
          $ref: '#/components/schemas/Session'
          description: Méthode MOT_DE_PASSE
        defi:
          type: string
          description: Méthode MOT_DE_PASSE_ET_OTP — un code est parti par SMS ; à joindre à `POST /v1/auth/otp/verify`
        expireDans:
          type: integer
          description: Validité du défi et du code, en secondes (avec `defi`)
          examples: [300]

    DefinitionMotDePasse:
      type: object
      required: [telephone, code, motDePasse, appareilId]
      properties:
        telephone:
          $ref: '#/components/schemas/Telephone'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        motDePasse:
          $ref: '#/components/schemas/MotDePasse'
        appareilId:
          type: string
          format: uuid

    ChangementMotDePasse:
      type: object
      required: [motDePasseActuel, nouveauMotDePasse]
      properties:
        motDePasseActuel:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        nouveauMotDePasse:
          $ref: '#/components/schemas/MotDePasse'

    RolePortail:
      type: string
      enum: [GROSSISTE, GRAND_CLIENT, ADMIN]

    ConfigurationAuthentification:
      type: object
      required: [roles, organisations]
      properties:
        roles:
          type: array
          description: Méthode par défaut de chaque rôle de portail (un élément par rôle au plus)
          items:
            type: object
            required: [role, methode]
            properties:
              role:
                $ref: '#/components/schemas/RolePortail'
              methode:
                $ref: '#/components/schemas/MethodeConnexion'
        organisations:
          type: array
          description: Exceptions par organisation GROSSISTE ou GRAND_CLIENT, prioritaires sur le rôle
          items:
            type: object
            required: [organisationId, methode]
            properties:
              organisationId:
                type: string
                format: uuid
              methode:
                $ref: '#/components/schemas/MethodeConnexion'
        fermerSessions:
          type: boolean
          writeOnly: true
          default: false
          description: |
            `PUT` seulement, jamais enregistré : ferme les sessions ouvertes des comptes dont la méthode
            devient plus stricte (sauf celle de l'appelant)

    Session:
      type: object
      required: [accessToken, refreshToken, expireDans, utilisateur]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expireDans:
          type: integer
          description: Durée de validité de l'accessToken, en secondes
        utilisateur:
          $ref: '#/components/schemas/Utilisateur'
        prefixeNumerotation:
          $ref: '#/components/schemas/PrefixeNumerotation'

    PrefixeNumerotation:
      type: string
      description: |
        Préfixe court attribué par le serveur au couple (ambulant, appareil) (RG-F1). Présent
        seulement pour le rôle AMBULANT ; stable pour un même ambulant sur un même appareilId. Un
        autre ambulant qui se connecte sur ce téléphone reçoit son propre préfixe, et le premier
        retrouve le sien (et la suite de ses séquences) à sa reconnexion.
      pattern: '^[A-Z0-9]{3,6}$'
      examples: [K7Q2]

    Utilisateur:
      type: object
      required: [id, telephone, roles, organisationId]
      properties:
        id:
          type: string
          format: uuid
        telephone:
          $ref: '#/components/schemas/Telephone'
        nom:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT, ADMIN]
        organisationId:
          type: string
          format: uuid
        hanoutId:
          type: string
          format: uuid
          description: Présent pour le rôle HANOUT
        nouveau:
          type: boolean
          description: Vrai à la première connexion (profil à compléter, consentement CNDP à recueillir)

    LienCible:
      type: object
      required: [cible, cibleId, telephoneMasque, expireLe]
      properties:
        cible:
          type: string
          enum: [DOCUMENT, RELEVE, DEMANDE_DEPANNAGE]
        cibleId:
          type: string
          format: uuid
        telephoneMasque:
          type: string
          examples: ['+2126•••••678']
        expireLe:
          type: string
          format: date-time

    ConsentementSaisie:
      type: object
      required: [versionTexte, traitementDonnees]
      properties:
        versionTexte:
          type: string
          description: |
            Version du texte d'information CNDP affiché, dans la langue de l'utilisateur. Celui de
            l'ambulant dit que son nom est montré aux grossistes et aux hanouts avec qui il travaille.
        traitementDonnees:
          type: boolean
        geolocalisation:
          type: boolean
          description: Ambulant seulement — position collectée uniquement quand il est disponible
        langue:
          $ref: '#/components/schemas/Langue'

    Consentement:
      allOf:
        - $ref: '#/components/schemas/ConsentementSaisie'
        - type: object
          required: [enregistreLe]
          properties:
            enregistreLe:
              type: string
              format: date-time

    JetonPush:
      type: object
      required: [jeton, plateforme]
      properties:
        jeton:
          type: string
        plateforme:
          type: string
          enum: [ANDROID, IOS]
        langue:
          $ref: '#/components/schemas/Langue'

    # ------------------------------------------------------------ referentiel
    OrganisationSaisie:
      type: object
      required: [type, nom, utilisateurs]
      properties:
        type:
          type: string
          enum: [GROSSISTE, GRAND_CLIENT]
        nom:
          type: string
        utilisateurs:
          type: array
          minItems: 1
          items:
            type: object
            required: [telephone]
            properties:
              telephone:
                $ref: '#/components/schemas/Telephone'
              nom:
                type: string
        position:
          $ref: '#/components/schemas/Position'
          description: Requise pour un grossiste
        adresse:
          type: string
        ville:
          type: string

    OrganisationCreee:
      type: object
      required: [id, type, nom, utilisateurs]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'organisation ; pour un grossiste, c'est aussi son grossisteId
        type:
          type: string
        nom:
          type: string
        utilisateurs:
          type: array
          items:
            type: object
            required: [id, telephone]
            properties:
              id:
                type: string
                format: uuid
              telephone:
                $ref: '#/components/schemas/Telephone'

    # ---------------------------------------------------------- administration
    MembreSaisie:
      type: object
      required: [telephone]
      properties:
        telephone:
          $ref: '#/components/schemas/Telephone'
        nom:
          type: string

    OrganisationAdmin:
      type: object
      required: [id, type, nom, creeLe, nombreUtilisateurs]
      properties:
        id:
          type: string
          format: uuid
          description: Pour un grossiste, c'est aussi son grossisteId
        type:
          $ref: '#/components/schemas/TypeOrganisation'
        nom:
          type: string
        creeLe:
          type: string
          format: date-time
        nombreUtilisateurs:
          type: integer
        grossiste:
          $ref: '#/components/schemas/Grossiste'
          description: Fiche du grossiste (position, adresse, ville) ; présente pour le type GROSSISTE

    TypeOrganisation:
      type: string
      enum: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT, PLATEFORME]
      description: PLATEFORME = organisation d'un administrateur

    OrganisationAdminPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/OrganisationAdmin'

    OrganisationDetail:
      allOf:
        - $ref: '#/components/schemas/OrganisationAdmin'
        - type: object
          required: [utilisateurs]
          properties:
            utilisateurs:
              type: array
              items:
                $ref: '#/components/schemas/UtilisateurAdmin'

    UtilisateurAdmin:
      type: object
      description: |
        Fiche de support d'un utilisateur (ADMIN seulement, CNDP). Jamais de code OTP, de jeton
        (accès, refresh, push) ni de session.
      required: [id, telephone, roles, organisation, actif, creeLe, motDePasseDefini, methodeConnexion, appareils]
      properties:
        id:
          type: string
          format: uuid
        telephone:
          $ref: '#/components/schemas/Telephone'
        nom:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [AMBULANT, HANOUT, GROSSISTE, GRAND_CLIENT, ADMIN]
        organisation:
          type: object
          required: [id, type, nom]
          properties:
            id:
              type: string
              format: uuid
            type:
              $ref: '#/components/schemas/TypeOrganisation'
            nom:
              type: string
        hanoutId:
          type: string
          format: uuid
          description: Fiche hanout (base POS), pour le rôle HANOUT
        actif:
          type: boolean
          description: Faux si l'administrateur a désactivé le compte
        desactiveLe:
          type: string
          format: date-time
          description: Présent si le compte est désactivé
        creeLe:
          type: string
          format: date-time
        consentement:
          $ref: '#/components/schemas/Consentement'
          description: Dernier consentement CNDP enregistré ; absent s'il n'en a jamais donné
        motDePasseDefini:
          type: boolean
          description: Un mot de passe de portail est enregistré (v0.9.0 ; jamais pour AMBULANT ni HANOUT ; l'empreinte n'est jamais renvoyée)
        motDePasseModifieLe:
          type: string
          format: date-time
          description: Dernière définition, modification ou réinitialisation du mot de passe
        methodeConnexion:
          $ref: '#/components/schemas/MethodeConnexion'
          description: Méthode effective (exception de l'organisation, sinon défaut du rôle)
        appareils:
          type: array
          description: |
            Appareils sur lesquels ce compte s'est connecté (v0.8.0 : y compris un téléphone partagé
            dont un autre compte est depuis le compte courant), du plus récemment vu au plus ancien.
          items:
            $ref: '#/components/schemas/AppareilAdmin'

    AppareilAdmin:
      type: object
      description: |
        Un appareil vu depuis un compte. Plusieurs comptes peuvent utiliser le même téléphone (un
        préfixe de numérotation par couple ambulant/appareil, RG-F1) ; l'appareil n'a qu'une session
        à la fois, celle du dernier compte connecté (`compteActuel`). Les dates (`creeLe`,
        `derniereConnexion`, `vuLe`) et le préfixe sont ceux de ce compte sur cet appareil ;
        `plateforme`, `langue`, `revoque` et `revoqueLe` sont ceux de l'appareil physique.
        La révocation vaut pour l'appareil, donc pour tous ses comptes (`autresComptes`).
      required: [appareilId, creeLe, compteActuel, sessionOuverte, pushActif, revoque, autresComptes]
      properties:
        appareilId:
          type: string
          format: uuid
        plateforme:
          type: string
          enum: [ANDROID, IOS]
          description: Connue dès que l'appareil a déclaré un jeton push
        langue:
          $ref: '#/components/schemas/Langue'
        prefixeNumerotation:
          $ref: '#/components/schemas/PrefixeNumerotation'
        creeLe:
          type: string
          format: date-time
          description: Première connexion de ce compte sur cet appareil
        derniereConnexion:
          type: string
          format: date-time
          description: Dernière connexion par OTP de ce compte sur cet appareil
        vuLe:
          type: string
          format: date-time
          description: Dernier appel authentifié de ce compte sur cet appareil (à 5 minutes près ; posé dès la connexion)
        compteActuel:
          type: boolean
          description: Ce compte est le dernier connecté sur l'appareil, le seul qui peut y avoir une session
        sessionOuverte:
          type: boolean
          description: Ce compte a une session ouverte sur l'appareil (jamais vrai si `compteActuel` est faux)
        pushActif:
          type: boolean
          description: Un jeton push est enregistré pour la session ouverte de ce compte (le jeton n'est jamais renvoyé)
        revoque:
          type: boolean
          description: Appareil révoqué (§10), pour tous ses comptes
        revoqueLe:
          type: string
          format: date-time
        autresComptes:
          type: array
          description: Autres comptes qui se sont connectés sur cet appareil, du plus ancien au plus récent
          items:
            $ref: '#/components/schemas/CompteAppareil'

    CompteAppareil:
      type: object
      required: [id, telephone]
      properties:
        id:
          type: string
          format: uuid
        telephone:
          $ref: '#/components/schemas/Telephone'
        nom:
          type: string

    UtilisateurAdminPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/UtilisateurAdmin'

    OperationAudit:
      type: string
      description: |
        Opération inscrite au journal d'audit : CONFIGURATION_CANAUX, ORGANISATION_CREEE,
        UTILISATEUR_AJOUTE, UTILISATEUR_DESACTIVE, UTILISATEUR_REACTIVE, APPAREIL_REVOQUE,
        IMPORT_HANOUTS, IMPORT_PRODUITS ; v0.9.0 : CONFIGURATION_AUTHENTIFICATION,
        MOT_DE_PASSE_REINITIALISE (par l'administrateur), MOT_DE_PASSE_DEFINI et MOT_DE_PASSE_MODIFIE
        (par l'utilisateur lui-même). Liste ouverte : une valeur inconnue s'affiche telle quelle.
      pattern: '^[A-Z_]{1,64}$'
      examples: [APPAREIL_REVOQUE]

    EntreeAudit:
      type: object
      required: [id, le, operation]
      properties:
        id:
          type: integer
          format: int64
        le:
          type: string
          format: date-time
        auteur:
          $ref: '#/components/schemas/Reference'
          description: Utilisateur qui a fait l'opération (`nom`, ou son téléphone s'il n'a pas de nom)
        appareilId:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/OperationAudit'
        details:
          type: object
          description: |
            Contexte de l'opération : identifiants (`utilisateurId`, `organisationId`, `appareilId`),
            bilan d'un import, configuration enregistrée. Jamais de téléphone, de code ni de secret.

    EntreeAuditPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/EntreeAudit'

    # ---------------------------------------------------------------- canaux
    Canal:
      type: string
      enum: [PUSH, SMS, WHATSAPP]
    TypeMessage:
      type: string
      description: Type de message de la couche canaux (lignes du tableau §9)
      enum: [OTP, RUPTURE_SIGNALEE, DEMANDE_ACCEPTEE, DEMANDE_PRISE, DEMANDE_EN_ROUTE, DEMANDE_LIVREE,
        DEMANDE_SANS_REPONSE, PROMO_CONFIRMEE, RESERVATION_EXPIRE_BIENTOT, PROPOSITION_DEPOT,
        RETRAIT_EFFECTUE, DOCUMENT_EMIS, RECEPTION_ECART, CONTESTATION]
    FournisseurCanal:
      type: string
      description: |
        Fournisseur d'un canal. JOURNAL écrit seulement le message dans les logs du serveur (poste de
        dev, démo) ; INFOBIP (SMS) et FCM (push, Firebase Cloud Messaging) sont les vrais opérateurs.
        WhatsApp n'a encore que JOURNAL.
      enum: [JOURNAL, INFOBIP, FCM]
    ConfigurationCanaux:
      type: object
      required: [canaux, types, organisations]
      properties:
        canaux:
          type: array
          description: Niveau système, un élément par canal
          items:
            $ref: '#/components/schemas/ParametreCanal'
        types:
          type: array
          description: Routage par type de message
          items:
            $ref: '#/components/schemas/RoutageMessage'
        organisations:
          type: array
          description: Canaux coupés pour les destinataires d'une organisation (les autres restent actifs)
          items:
            $ref: '#/components/schemas/CanauxOrganisation'
    ParametreCanal:
      type: object
      required: [canal, actif, fournisseur]
      properties:
        canal:
          $ref: '#/components/schemas/Canal'
        actif:
          type: boolean
          description: Canal ouvert au niveau du système
        fournisseur:
          $ref: '#/components/schemas/FournisseurCanal'
        fournisseursDisponibles:
          type: array
          readOnly: true
          description: Fournisseurs de ce canal sur ce serveur (ignoré en écriture)
          items:
            type: object
            required: [code, configure]
            properties:
              code:
                $ref: '#/components/schemas/FournisseurCanal'
              configure:
                type: boolean
                description: Identifiants présents sur le serveur ; seul un fournisseur configuré peut être choisi
    RoutageMessage:
      type: object
      required: [type, principal]
      properties:
        type:
          $ref: '#/components/schemas/TypeMessage'
        principal:
          $ref: '#/components/schemas/Canal'
        repli:
          $ref: '#/components/schemas/Canal'
          description: Canal de repli, différent du principal ; absent = pas de repli
        inactifs:
          type: array
          description: Canaux coupés pour ce type de message
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Canal'
    CanauxOrganisation:
      type: object
      required: [organisationId, inactifs]
      properties:
        organisationId:
          type: string
          format: uuid
        inactifs:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Canal'

    FichierImport:
      type: object
      required: [fichier]
      properties:
        fichier:
          type: string
          contentMediaType: text/csv

    BilanImport:
      type: object
      required: [crees, misAJour, rejets]
      properties:
        crees:
          type: integer
        misAJour:
          type: integer
        rejets:
          type: array
          items:
            type: object
            required: [ligne, erreur]
            properties:
              ligne:
                type: integer
                description: Numéro de ligne dans le fichier (l'en-tête est la ligne 1)
              erreur:
                type: string

    Hanout:
      type: object
      required: [id, nom, position]
      properties:
        id:
          type: string
          format: uuid
        codePos:
          type: string
          description: Identifiant dans la base POS de RED
        nom:
          type: string
        gerant:
          type: string
        telephone:
          $ref: '#/components/schemas/Telephone'
        position:
          $ref: '#/components/schemas/Position'
        adresse:
          type: string
        ville:
          type: string
        photoFacadeUrl:
          type: string
          format: uri
        ice:
          type: string
          pattern: '^[0-9]{15}$'
        distanceM:
          type: integer
          description: Présente seulement si lat et lon sont fournis

    HanoutPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Hanout'

    Categorie:
      type: object
      description: |
        Libellés posés par l'import produits (colonnes categorie_libelle_*) ; `libelle.fr` vaut le
        code tant qu'aucun libellé français n'a été importé.
      required: [code, libelle]
      properties:
        code:
          type: string
        libelle:
          $ref: '#/components/schemas/LibelleI18n'

    Region:
      type: object
      required: [code, nom, villes]
      properties:
        code:
          type: string
          examples: [CASABLANCA_SETTAT]
        nom:
          $ref: '#/components/schemas/LibelleI18n'
        villes:
          type: array
          items:
            type: object
            required: [code, nom]
            properties:
              code:
                type: string
                examples: [CASABLANCA]
              nom:
                $ref: '#/components/schemas/LibelleI18n'

    Produit:
      type: object
      required: [id, ean, libelle, marque, categorie, conditionnement, unitesParConditionnement]
      properties:
        id:
          type: string
          format: uuid
        ean:
          $ref: '#/components/schemas/Ean'
        libelle:
          $ref: '#/components/schemas/LibelleI18n'
        marque:
          type: string
        categorie:
          $ref: '#/components/schemas/Categorie'
        conditionnement:
          type: string
          enum: [UNITE, PACK, CARTON]
        unitesParConditionnement:
          type: integer
          minimum: 1
        tauxTva:
          $ref: '#/components/schemas/TauxTva'
        photoUrl:
          type: string
          format: uri
          description: Image compressée (faible consommation de données)

    ProduitPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Produit'

    Grossiste:
      type: object
      required: [id, nom, position]
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        adresse:
          type: string
        ville:
          type: string
        distanceM:
          type: integer
          description: Présente seulement si une position est fournie

    GrossistePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Grossiste'

    # ------------------------------------------------------------ sync : opérations
    LotOperations:
      type: object
      required: [appareilId, operations]
      properties:
        appareilId:
          type: string
          format: uuid
          description: Doit être l'appareil de la session (403 sinon)
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Operation'

    OperationBase:
      type: object
      required: [id, type, creeLe]
      properties:
        id:
          type: string
          format: uuid
          description: Généré par l'appareil ; clé d'idempotence
        type:
          type: string
        creeLe:
          type: string
          format: date-time
          description: Horodatage de l'appareil au moment du geste (RG-S2) ; le serveur garde aussi son heure de réception

    Operation:
      oneOf:
        - $ref: '#/components/schemas/OperationChargement'
        - $ref: '#/components/schemas/OperationRetour'
        - $ref: '#/components/schemas/OperationInventaire'
        - $ref: '#/components/schemas/OperationEmissionDocument'
        - $ref: '#/components/schemas/OperationAvoir'
        - $ref: '#/components/schemas/OperationVersement'
        - $ref: '#/components/schemas/OperationTarif'
        - $ref: '#/components/schemas/OperationHanout'
        - $ref: '#/components/schemas/OperationCreditHanout'
        - $ref: '#/components/schemas/OperationParametresAmbulant'
        - $ref: '#/components/schemas/OperationProfilAmbulant'
        - $ref: '#/components/schemas/OperationResolutionContestation'
        - $ref: '#/components/schemas/OperationTournee'
        - $ref: '#/components/schemas/OperationVisite'
      discriminator:
        propertyName: type
        mapping:
          CHARGEMENT: '#/components/schemas/OperationChargement'
          RETOUR: '#/components/schemas/OperationRetour'
          INVENTAIRE: '#/components/schemas/OperationInventaire'
          EMISSION_DOCUMENT: '#/components/schemas/OperationEmissionDocument'
          AVOIR: '#/components/schemas/OperationAvoir'
          VERSEMENT: '#/components/schemas/OperationVersement'
          TARIF: '#/components/schemas/OperationTarif'
          HANOUT: '#/components/schemas/OperationHanout'
          CREDIT_HANOUT: '#/components/schemas/OperationCreditHanout'
          PARAMETRES_AMBULANT: '#/components/schemas/OperationParametresAmbulant'
          PROFIL_AMBULANT: '#/components/schemas/OperationProfilAmbulant'
          RESOLUTION_CONTESTATION: '#/components/schemas/OperationResolutionContestation'
          TOURNEE: '#/components/schemas/OperationTournee'
          VISITE: '#/components/schemas/OperationVisite'

    OperationChargement:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: CHARGEMENT
            donnees:
              $ref: '#/components/schemas/Chargement'

    OperationRetour:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: RETOUR
            donnees:
              $ref: '#/components/schemas/Retour'

    OperationInventaire:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: INVENTAIRE
            donnees:
              $ref: '#/components/schemas/Inventaire'

    OperationEmissionDocument:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: EMISSION_DOCUMENT
            donnees:
              $ref: '#/components/schemas/EmissionDocument'

    OperationAvoir:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: AVOIR
            donnees:
              $ref: '#/components/schemas/AvoirSaisie'

    OperationVersement:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: VERSEMENT
            donnees:
              $ref: '#/components/schemas/VersementSaisie'

    OperationTarif:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: TARIF
            donnees:
              $ref: '#/components/schemas/Tarif'

    OperationHanout:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: HANOUT
            donnees:
              $ref: '#/components/schemas/NouveauHanout'

    NouveauHanout:
      type: object
      description: |
        Hanout absent de la base POS, créé sur le terrain (UUID de l'appareil) pour qu'une vente
        hors ligne ne soit jamais perdue. Envoyé avant les opérations qui le référencent ;
        rapproché ensuite de la base POS par l'administrateur.
      required: [hanoutId, nom]
      properties:
        hanoutId:
          type: string
          format: uuid
        nom:
          type: string
        gerant:
          type: string
        telephone:
          $ref: '#/components/schemas/Telephone'
        position:
          $ref: '#/components/schemas/Position'
        adresse:
          type: string
        ville:
          type: string
        ice:
          type: string
          pattern: '^[0-9]{15}$'

    OperationCreditHanout:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: CREDIT_HANOUT
            donnees:
              $ref: '#/components/schemas/CreditHanoutSaisie'

    OperationParametresAmbulant:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: PARAMETRES_AMBULANT
            donnees:
              $ref: '#/components/schemas/ParametresAmbulantSaisie'

    OperationProfilAmbulant:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: PROFIL_AMBULANT
            donnees:
              $ref: '#/components/schemas/ProfilAmbulantSaisie'

    OperationResolutionContestation:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: RESOLUTION_CONTESTATION
            donnees:
              $ref: '#/components/schemas/ResolutionContestation'

    OperationTournee:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: TOURNEE
            donnees:
              $ref: '#/components/schemas/TourneeSaisie'

    OperationVisite:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - type: object
          required: [type, donnees]
          properties:
            type:
              const: VISITE
            donnees:
              $ref: '#/components/schemas/VisiteSaisie'

    JourSemaine:
      type: integer
      minimum: 1
      maximum: 7
      description: Jour ISO 8601 de la semaine, 1 = lundi … 7 = dimanche

    TourneeSaisie:
      type: object
      description: |
        Tournée planifiée (§3.3), saisie hors ligne : l'opération remplace toute la tournée (un champ
        facultatif absent est effacé). `supprimee: true` la retire des appareils (SUPPRESSION de
        l'entité TOURNEE) ; `jours` et `hanoutIds` sont alors facultatifs. Une tournée modifiée ou
        supprimée plus récemment sur un autre appareil est conservée (EN_CONFLIT,
        VERSION_SERVEUR_CONSERVEE). Un hanout inconnu, un `id` de tournée d'un autre ambulant ou
        l'absence de consentement CNDP actif rendent l'opération REJETEE. Les hanouts des tournées
        forment la zone de tournée du ciblage des promos (`Ciblage.zones`, `Ciblage.rayonM`).
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Généré par l'appareil
        nom:
          type: string
          maxLength: 100
          examples: [Tournée du lundi]
        jours:
          type: array
          description: Jours de passage ; au moins un sauf si `supprimee`
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/JourSemaine'
        hanoutIds:
          type: array
          description: Hanouts à visiter, dans l'ordre de passage (hanouts connus de l'ambulant, entité HANOUT)
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
        supprimee:
          type: boolean
          default: false

    Tournee:
      type: object
      description: Tournée planifiée de l'ambulant connecté (entité tirée TOURNEE)
      required: [id, jours, hanoutIds, modifieLe]
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        jours:
          type: array
          items:
            $ref: '#/components/schemas/JourSemaine'
        hanoutIds:
          type: array
          items:
            type: string
            format: uuid
        supprimee:
          type: boolean
          description: Présent et vrai seulement dans `Conflit.versionServeur`, pour une tournée supprimée ailleurs
        modifieLe:
          type: string
          format: date-time
          description: Horodatage de l'appareil de la dernière modification retenue

    MotifVisite:
      type: string
      enum: [FERME, PAS_BESOIN, GERANT_ABSENT, AUTRE]
      description: Raison d'une visite sans vente

    VisiteSaisie:
      type: object
      description: |
        Visite d'un hanout sans vente (§3.3), pour l'historique des visites ; une vente compte déjà
        comme une visite (entité DOCUMENT), rien à envoyer pour elle. L'identifiant de la visite est
        celui de l'opération. Hanout inconnu ou consentement CNDP absent : REJETEE.
      required: [hanoutId, horodatage, motif]
      properties:
        hanoutId:
          type: string
          format: uuid
        horodatage:
          type: string
          format: date-time
          description: Heure de la visite (appareil)
        motif:
          $ref: '#/components/schemas/MotifVisite'

    Visite:
      type: object
      description: Visite sans vente (entité tirée VISITE, `id` = celui de l'opération VISITE)
      required: [id, hanoutId, horodatage, motif]
      properties:
        id:
          type: string
          format: uuid
        hanoutId:
          type: string
          format: uuid
        horodatage:
          type: string
          format: date-time
        motif:
          $ref: '#/components/schemas/MotifVisite'

    ResolutionContestation:
      type: object
      description: |
        L'ambulant clôt une contestation qui lui est adressée (après un avoir, une explication…).
        Rejouer sur une contestation déjà RESOLUE ne change rien.
      required: [contestationId]
      properties:
        contestationId:
          type: string
          format: uuid
        commentaire:
          type: string
          maxLength: 500

    LigneQuantite:
      type: object
      required: [produitId, quantite]
      properties:
        produitId:
          type: string
          format: uuid
        quantite:
          type: integer
          minimum: 1

    LigneChargement:
      description: |
        Ligne d'un chargement manuel ou d'un bon de sortie (§3.2, §3.8) : `LigneQuantite` plus la date
        de péremption et le prix d'achat payé par l'ambulant, facultatifs. Reprises dans le
        `Mouvement` CHARGEMENT, pour que l'app calcule hors ligne la marge et la péremption.
      allOf:
        - $ref: '#/components/schemas/LigneQuantite'
        - type: object
          properties:
            datePeremption:
              type: string
              format: date
              examples: ['2026-12-31']
            prixUnitaire:
              $ref: '#/components/schemas/Montant'
              description: Prix d'achat unitaire TTC payé par l'ambulant (comme les autres prix)

    Chargement:
      type: object
      description: |
        Chargement du stock embarqué : scan du QR d'un bon de sortie (`qrJeton`, les lignes sont
        lues dans le QR) ou saisie manuelle (`lignes`). Un bon déjà chargé est signalé en anomalie
        CHARGEMENT_EN_DOUBLE et n'ajoute rien ; un bon adressé à un autre ambulant est REJETE.
      oneOf:
        - required: [qrJeton]
        - required: [lignes]
      properties:
        qrJeton:
          type: string
          description: Contenu du QR du bon de sortie, transmis tel quel (vérifié par le serveur)
        grossisteId:
          type: string
          format: uuid
          description: Saisie manuelle seulement, facultatif
        lignes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LigneChargement'

    Retour:
      type: object
      description: |
        RETOUR d'un hanout vers l'ambulant (entrée en stock) ou de l'ambulant vers le grossiste
        (sortie). Le remboursement ou la baisse du solde passe par un avoir distinct.
      required: [sens, motif, lignes]
      properties:
        sens:
          type: string
          enum: [HANOUT_VERS_AMBULANT, AMBULANT_VERS_GROSSISTE]
        hanoutId:
          type: string
          format: uuid
          description: Requis pour HANOUT_VERS_AMBULANT
        grossisteId:
          type: string
          format: uuid
          description: Requis pour AMBULANT_VERS_GROSSISTE
        motif:
          type: string
          enum: [ABIME, PERIME, INVENDU, AUTRE]
        remisEnVente:
          type: boolean
          default: false
          description: HANOUT_VERS_AMBULANT seulement — faux si le produit abîmé ou périmé ne rentre pas dans le stock vendable
        lignes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LigneQuantite'

    Inventaire:
      type: object
      description: |
        Inventaire de fin de journée. Le serveur compare au stock théorique, crée les mouvements
        d'AJUSTEMENT et signale ECART_SANS_MOTIF quand un écart dépasse le seuil paramétré sans
        motif (RG-S4).
      required: [lignes]
      properties:
        lignes:
          type: array
          minItems: 1
          items:
            type: object
            required: [produitId, quantiteComptee]
            properties:
              produitId:
                type: string
                format: uuid
              quantiteComptee:
                type: integer
                minimum: 0
              motifEcart:
                type: string
                maxLength: 500

    EmissionDocument:
      type: object
      description: |
        Vente : bon de livraison par défaut. L'app ne propose FACTURE que si
        `ParametresAmbulant.mentionsLegales` est présent (RG-F2) et copie ces mentions, telles
        qu'elle les connaît au moment de l'émission, dans `mentionsLegales` : une facture émise
        hors ligne reste valable même si le profil change avant la synchronisation (RG-F1, RG-C4).
        Un document rejeté (référence inconnue) laisse un trou qui remonte en NUMEROTATION_TROU.
        Le préfixe du numéro doit être `Session.prefixeNumerotation` de l'appareil qui pousse (sinon REJETEE, RG-F1).
        Une FACTURE sans `mentionsLegales` ne peut venir que d'une app non conforme : REJETEE.
        Le reste à payer (total − règlements) passe au crédit du hanout. Avec `demandeDepannageId`,
        la vente est liée à la demande, qui passe à LIVREE (RG-D4).
      required: [documentId, type, numero, sequence, hanoutId, lignes]
      if:
        properties:
          type:
            const: FACTURE
      then:
        required: [mentionsLegales]
        properties:
          mentionsLegales:
            $ref: '#/components/schemas/MentionsLegales'
      properties:
        mentionsLegales:
          $ref: '#/components/schemas/MentionsLegales'
        documentId:
          type: string
          format: uuid
        type:
          type: string
          enum: [BON_LIVRAISON, FACTURE]
        numero:
          $ref: '#/components/schemas/NumeroDocument'
        sequence:
          $ref: '#/components/schemas/SequenceDocument'
        hanoutId:
          type: string
          format: uuid
        lignes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LigneDocumentSaisie'
        reglements:
          type: array
          description: Paiements reçus à la livraison ; vide ou absent = tout à crédit
          items:
            $ref: '#/components/schemas/Reglement'
        demandeDepannageId:
          type: string
          format: uuid
        confirmationHanout:
          $ref: '#/components/schemas/ConfirmationHanout'
        avertissementCreditAccepte:
          type: boolean
          description: Vrai si l'ambulant a passé outre l'avertissement de plafond ou de délai (RG-C3)

    NumeroDocument:
      type: string
      description: |
        `{prefixe appareil}-{BL|FA|AV}-{séquence sur 6 chiffres}`. Numérotation continue et sans
        trou par émetteur, appareil et type (RG-F1) ; un trou ou un doublon est signalé en anomalie.
      pattern: '^[A-Z0-9]{3,6}-(BL|FA|AV)-[0-9]{6,}$'
      examples: [K7Q2-BL-000123]

    SequenceDocument:
      type: integer
      format: int64
      minimum: 1
      description: Rang du document dans la série de l'appareil (même valeur que la fin du numéro)

    LigneDocumentSaisie:
      type: object
      description: |
        ARTICLE : produit vendu ; `campagneId` et `reservationId` quand il vient du stock promo
        (traçabilité RG-S3). REMISE_PONCTUELLE et REMISE_PROMO : lignes séparées de montant
        négatif (RG-F3), REMISE_PROMO avec la référence de la campagne.
      required: [nature, produitId]
      allOf:
        - if:
            properties:
              nature:
                const: ARTICLE
          then:
            required: [quantite, prixUnitaire]
            properties:
              quantite:
                minimum: 1
              prixUnitaire:
                minimum: 0
          else:
            required: [montant]
            properties:
              montant:
                exclusiveMaximum: 0
        - if:
            properties:
              nature:
                const: REMISE_PROMO
          then:
            required: [campagneId]
            properties:
              campagneId:
                format: uuid
      properties:
        nature:
          type: string
          enum: [ARTICLE, REMISE_PONCTUELLE, REMISE_PROMO]
        produitId:
          type: string
          format: uuid
        quantite:
          type: integer
          minimum: 1
          description: ARTICLE seulement
        prixUnitaire:
          $ref: '#/components/schemas/Montant'
        tarif:
          type: string
          enum: [STANDARD, NEGOCIE]
          description: ARTICLE seulement
        montant:
          $ref: '#/components/schemas/Montant'
        campagneId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
        tauxTva:
          $ref: '#/components/schemas/TauxTva'
          description: |
            Taux du produit tel que l'appareil le connaît à l'émission (`Produit.tauxTva`), figé dans
            la pièce comme les mentions légales ; absent, le serveur prend le taux actuel du produit.

    Reglement:
      type: object
      required: [mode, montant]
      properties:
        mode:
          type: string
          enum: [ESPECES, CHEQUE]
        montant:
          $ref: '#/components/schemas/Montant'
        chequeNumero:
          type: string
        chequeBanque:
          type: string

    ConfirmationHanout:
      type: object
      required: [mode, le]
      properties:
        mode:
          type: string
          enum: [SIGNATURE, CONFIRMATION_ECRAN]
        signaturePng:
          type: string
          contentEncoding: base64
          contentMediaType: image/png
          maxLength: 131072
          description: PNG en base64, 96 Ko au plus une fois décodé (l'app le réduit à 320 px de large)
        le:
          type: string
          format: date-time

    AvoirSaisie:
      type: object
      description: |
        Seul moyen d'annuler tout ou partie d'un document (RG-C4). Sans `lignes`, annule le
        restant du document (ses lignes sont reprises pour la traçabilité promo). Numéroté dans la
        série AV de l'appareil (RG-F1). Un avoir dont le total dépasse le restant à annuler (total du
        document moins les avoirs déjà émis) est REJETE (`regle` RG-C4) : l'app ne doit pas le proposer.
      required: [documentId, documentOrigineId, numero, sequence, motif]
      properties:
        documentId:
          type: string
          format: uuid
        documentOrigineId:
          type: string
          format: uuid
        numero:
          $ref: '#/components/schemas/NumeroDocument'
        sequence:
          $ref: '#/components/schemas/SequenceDocument'
        motif:
          type: string
          enum: [ERREUR_SAISIE, RETOUR_PRODUIT, GESTE_COMMERCIAL, AUTRE]
        commentaire:
          type: string
          maxLength: 500
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneDocumentSaisie'

    VersementSaisie:
      type: object
      description: |
        Versement d'un hanout. Sans `imputations`, le serveur l'impute sur les documents à crédit
        les plus anciens (FIFO, RG-C2) ; avec, il respecte la répartition choisie.
      required: [versementId, hanoutId, mode, montant]
      properties:
        versementId:
          type: string
          format: uuid
        hanoutId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [ESPECES, CHEQUE]
        montant:
          $ref: '#/components/schemas/Montant'
        chequeNumero:
          type: string
        chequeBanque:
          type: string
        imputations:
          type: array
          description: |
            Répartition choisie (RG-C2) ; absente ou vide : FIFO. Chaque part est plafonnée au reste dû de la
            pièce selon le serveur (l'appareil a pu calculer sur un état périmé) et le surplus suit en FIFO.
          items:
            $ref: '#/components/schemas/Imputation'

    Imputation:
      type: object
      required: [documentId, montant]
      properties:
        documentId:
          type: string
          format: uuid
        montant:
          $ref: '#/components/schemas/Montant'

    Tarif:
      type: object
      description: Tarif standard de l'ambulant (sans hanoutId) ou tarif négocié avec un hanout
      required: [produitId, prixUnitaire]
      properties:
        produitId:
          type: string
          format: uuid
        hanoutId:
          type: string
          format: uuid
        prixUnitaire:
          $ref: '#/components/schemas/Montant'

    CreditHanoutSaisie:
      type: object
      description: Plafond et délai maximal de crédit pour un hanout (§3.5)
      required: [hanoutId]
      properties:
        hanoutId:
          type: string
          format: uuid
        plafond:
          $ref: '#/components/schemas/Montant'
        delaiMaxJours:
          type: integer
          minimum: 1

    ParametresAmbulantSaisie:
      type: object
      description: Un champ absent garde sa valeur serveur.
      properties:
        politiqueDepassementCredit:
          $ref: '#/components/schemas/PolitiqueDepassementCredit'
        plafondRemisePonctuellePourcent:
          type: number
          minimum: 0
          maximum: 100
        mentionsLegales:
          oneOf:
            - $ref: '#/components/schemas/MentionsLegales'
            - type: 'null'
          description: |
            ICE, IF, RC et assujettissement à la TVA de l'ambulant auto-entrepreneur ou société
            (§3.1, RG-F2) : c'est la partie fiscale du profil, gardée ici et non dans
            `ProfilAmbulantSaisie`. Présentes, elles permettent la FACTURE (v0.5.0).
            `null` les efface (v0.10.0) ; absentes, elles sont gardées. Après l'effacement, une
            FACTURE sans ses propres `mentionsLegales` est REJETEE (RG-F2) ; une FACTURE émise hors
            ligne avant l'effacement porte sa copie des mentions et reste valable.

    ProfilAmbulantSaisie:
      type: object
      description: |
        Profil de l'ambulant (§3.1), saisi hors ligne. L'opération remplace tout le profil : un champ
        facultatif absent est effacé. Le nom est montré aux grossistes et aux hanouts avec qui
        l'ambulant travaille (jamais aux grands clients, §5.4). Un code de ville ou de catégorie
        inconnu rend l'opération REJETEE, de même que l'absence de consentement CNDP actif
        (…/consentement-requis). Un profil modifié plus récemment sur un autre appareil
        est conservé (EN_CONFLIT, VERSION_SERVEUR_CONSERVEE). Les mentions légales (ICE, IF, RC, TVA)
        sont dans `ParametresAmbulantSaisie.mentionsLegales`.
        Les grossistes déclarés (`grossisteIds`, v0.10.0) rattachent l'ambulant comme un bon de
        sortie reçu (`GET /v1/ambulants`, priorité des promos §9) ; un grossiste inconnu rend
        l'opération REJETEE.
      required: [nom]
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Youssef El Amrani]
        cin:
          type: string
          pattern: '^[A-Z]{1,2}[0-9]{1,6}$'
          description: Carte nationale d'identité, facultative ; visible du seul ambulant (droit d'accès compris)
          examples: [BK123456]
        vehicule:
          type: string
          maxLength: 100
          examples: [Triporteur Docker]
        villes:
          type: array
          description: Zones couvertes, au grain de la ville (codes de `GET /v1/regions`)
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            examples: [CASABLANCA]
        categories:
          type: array
          description: Catégories vendues (codes de `GET /v1/categories`), utilisées par `Ciblage.categories`
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            examples: [EPICERIE]
        grossisteIds:
          type: array
          description: Grossistes fournisseurs déclarés (§3.1), identifiants de `GET /v1/grossistes`
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid

    ProfilAmbulant:
      allOf:
        - $ref: '#/components/schemas/ProfilAmbulantSaisie'
        - type: object
          required: [villes, categories, grossisteIds, modifieLe]
          properties:
            modifieLe:
              type: string
              format: date-time
              description: Horodatage de l'appareil de la dernière modification retenue

    PolitiqueDepassementCredit:
      type: string
      enum: [BLOQUER, AVERTIR]
      description: Comportement à la vente quand le plafond ou le délai d'un hanout est dépassé (RG-C3)

    # ------------------------------------------------------------ sync : résultats
    ResultatLot:
      type: object
      required: [resultats]
      properties:
        resultats:
          type: array
          items:
            $ref: '#/components/schemas/ResultatOperation'

    ResultatOperation:
      type: object
      required: [operationId, statut]
      properties:
        operationId:
          type: string
          format: uuid
        statut:
          type: string
          enum: [APPLIQUEE, DEJA_APPLIQUEE, EN_CONFLIT, REJETEE]
          description: |
            APPLIQUEE (éventuellement avec anomalies) ; DEJA_APPLIQUEE : rejeu, aucun nouvel effet ;
            EN_CONFLIT : résolue côté serveur, voir `conflit` ; REJETEE : mal formée (dont FACTURE
            sans mentions légales, RG-F2) ou référence inconnue, rien n'est appliqué, voir `erreur`.
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/Anomalie'
        conflit:
          $ref: '#/components/schemas/Conflit'
        erreur:
          $ref: '#/components/schemas/Problem'

    Conflit:
      type: object
      description: Conflit entre l'opération et l'état serveur (ex. plafond modifié depuis un autre appareil), résolu et journalisé
      required: [code, resolution]
      properties:
        code:
          type: string
          enum: [MODIFIE_AILLEURS, ETAT_CHANGE]
        resolution:
          type: string
          enum: [OPERATION_APPLIQUEE, VERSION_SERVEUR_CONSERVEE]
        detail:
          type: string
        versionServeur:
          type: object
          description: Valeur conservée côté serveur quand l'opération n'a pas été retenue

    Anomalie:
      type: object
      required: [id, type, regle, statut, detecteeLe]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - STOCK_NEGATIF
            - ECART_SANS_MOTIF
            - NUMEROTATION_TROU
            - NUMERO_EN_DOUBLE
            - PLAFOND_CREDIT_DEPASSE
            - DELAI_CREDIT_DEPASSE
            - CHARGEMENT_EN_DOUBLE
            - PROMO_SANS_RETRAIT
            - DEMANDE_NON_ATTRIBUEE
            - REMISE_PLAFOND_DEPASSE
            - TVA_INCONNUE
          description: |
            TVA_INCONNUE (RG-F2, facture d'un ambulant assujetti dont un produit n'a pas de taux :
            enregistrée, sans `tva` ; l'app ne devrait pas proposer FACTURE dans ce cas),
            STOCK_NEGATIF (RG-S1), ECART_SANS_MOTIF (RG-S4), NUMEROTATION_TROU et NUMERO_EN_DOUBLE
            (RG-F1), PLAFOND_CREDIT_DEPASSE et DELAI_CREDIT_DEPASSE (RG-C3),
            CHARGEMENT_EN_DOUBLE (bon de sortie déjà chargé),
            PROMO_SANS_RETRAIT (RG-S3, vente promo au-delà de la quantité retirée),
            DEMANDE_NON_ATTRIBUEE (RG-D4, livraison d'une demande prise par un autre),
            REMISE_PLAFOND_DEPASSE (§3.4, remise ponctuelle au-delà du plafond de l'ambulant).
        regle:
          type: string
          examples: [RG-S1]
        operationId:
          type: string
          format: uuid
        produitId:
          type: string
          format: uuid
        detail:
          type: string
        statut:
          type: string
          enum: [OUVERTE, RESOLUE]
        detecteeLe:
          type: string
          format: date-time

    # ------------------------------------------------------------ sync : changements
    LotChangements:
      type: object
      required: [curseur, plusDeChangements, changements]
      properties:
        curseur:
          type: string
        plusDeChangements:
          type: boolean
        changements:
          type: array
          items:
            $ref: '#/components/schemas/Changement'

    ChangementBase:
      type: object
      required: [entite, id, action]
      properties:
        entite:
          type: string
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [UPSERT, SUPPRESSION]
          description: SUPPRESSION retire l'objet de l'appareil (promo terminée, hanout sorti du périmètre…) ; jamais utilisée pour un document de vente

    Changement:
      oneOf:
        - $ref: '#/components/schemas/ChangementProduit'
        - $ref: '#/components/schemas/ChangementHanout'
        - $ref: '#/components/schemas/ChangementStock'
        - $ref: '#/components/schemas/ChangementMouvement'
        - $ref: '#/components/schemas/ChangementDocument'
        - $ref: '#/components/schemas/ChangementVersement'
        - $ref: '#/components/schemas/ChangementCompteCredit'
        - $ref: '#/components/schemas/ChangementTarif'
        - $ref: '#/components/schemas/ChangementPromo'
        - $ref: '#/components/schemas/ChangementReservation'
        - $ref: '#/components/schemas/ChangementAnomalie'
        - $ref: '#/components/schemas/ChangementParametres'
        - $ref: '#/components/schemas/ChangementProfil'
        - $ref: '#/components/schemas/ChangementBonSortie'
        - $ref: '#/components/schemas/ChangementContestation'
        - $ref: '#/components/schemas/ChangementTournee'
        - $ref: '#/components/schemas/ChangementVisite'
      discriminator:
        propertyName: entite
        mapping:
          PRODUIT: '#/components/schemas/ChangementProduit'
          HANOUT: '#/components/schemas/ChangementHanout'
          STOCK: '#/components/schemas/ChangementStock'
          MOUVEMENT: '#/components/schemas/ChangementMouvement'
          DOCUMENT: '#/components/schemas/ChangementDocument'
          VERSEMENT: '#/components/schemas/ChangementVersement'
          COMPTE_CREDIT: '#/components/schemas/ChangementCompteCredit'
          TARIF: '#/components/schemas/ChangementTarif'
          PROMO: '#/components/schemas/ChangementPromo'
          RESERVATION: '#/components/schemas/ChangementReservation'
          ANOMALIE: '#/components/schemas/ChangementAnomalie'
          PARAMETRES: '#/components/schemas/ChangementParametres'
          PROFIL: '#/components/schemas/ChangementProfil'
          BON_SORTIE: '#/components/schemas/ChangementBonSortie'
          CONTESTATION: '#/components/schemas/ChangementContestation'
          TOURNEE: '#/components/schemas/ChangementTournee'
          VISITE: '#/components/schemas/ChangementVisite'

    ChangementProduit:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: PRODUIT
            donnees:
              $ref: '#/components/schemas/Produit'

    ChangementHanout:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: HANOUT
            donnees:
              $ref: '#/components/schemas/Hanout'

    ChangementStock:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: STOCK
            donnees:
              $ref: '#/components/schemas/LigneStock'

    ChangementMouvement:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: MOUVEMENT
            donnees:
              $ref: '#/components/schemas/Mouvement'

    ChangementDocument:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: DOCUMENT
            donnees:
              $ref: '#/components/schemas/Document'

    ChangementVersement:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: VERSEMENT
            donnees:
              $ref: '#/components/schemas/Versement'

    ChangementCompteCredit:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: COMPTE_CREDIT
            donnees:
              $ref: '#/components/schemas/CompteCredit'

    ChangementTarif:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: TARIF
            donnees:
              $ref: '#/components/schemas/Tarif'

    ChangementPromo:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: PROMO
            donnees:
              $ref: '#/components/schemas/OffrePromo'

    ChangementReservation:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: RESERVATION
            donnees:
              $ref: '#/components/schemas/Reservation'

    ChangementAnomalie:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: ANOMALIE
            donnees:
              $ref: '#/components/schemas/Anomalie'

    ChangementParametres:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: PARAMETRES
            donnees:
              $ref: '#/components/schemas/ParametresAmbulant'

    ChangementProfil:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          description: Profil de l'ambulant connecté (`id` = son utilisateur) ; absent tant qu'il n'est pas saisi
          properties:
            entite:
              const: PROFIL
            donnees:
              $ref: '#/components/schemas/ProfilAmbulant'

    ChangementBonSortie:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: BON_SORTIE
            donnees:
              $ref: '#/components/schemas/BonSortie'

    ChangementContestation:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          properties:
            entite:
              const: CONTESTATION
            donnees:
              $ref: '#/components/schemas/Contestation'

    ChangementTournee:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          description: Tournée planifiée (v0.10.0) ; SUPPRESSION quand elle est supprimée sur un appareil
          properties:
            entite:
              const: TOURNEE
            donnees:
              $ref: '#/components/schemas/Tournee'

    ChangementVisite:
      allOf:
        - $ref: '#/components/schemas/ChangementBase'
        - type: object
          description: |
            Visite sans vente (v0.10.0), pour l'historique des visites et des ventes par hanout (§3.3)
            avec les entités DOCUMENT
          properties:
            entite:
              const: VISITE
            donnees:
              $ref: '#/components/schemas/Visite'

    ParametresAmbulant:
      type: object
      required: [politiqueDepassementCredit, seuilEcartInventairePourcent]
      properties:
        politiqueDepassementCredit:
          $ref: '#/components/schemas/PolitiqueDepassementCredit'
        plafondRemisePonctuellePourcent:
          type: number
        seuilEcartInventairePourcent:
          type: number
          description: Écart d'inventaire au-delà duquel un motif est exigé (RG-S4), fixé par l'administrateur
        mentionsLegales:
          $ref: '#/components/schemas/MentionsLegales'
          description: Présentes si l'ambulant peut émettre des factures (RG-F2), déclarées par `ParametresAmbulantSaisie.mentionsLegales`

    # ------------------------------------------------------------ stock
    TypeMouvement:
      type: string
      enum: [CHARGEMENT, VENTE, RETOUR, AJUSTEMENT, PROMO]
      description: Types de mouvement de RG-S2 ; PROMO = entrée de stock promo au retrait chez le grossiste

    Mouvement:
      type: object
      description: Mouvement de stock (RG-S2) — type, auteur, horodatage et appareil toujours présents
      required: [id, type, produitId, quantite, auteurId, appareilId, horodatage, recuLe, operationId]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeMouvement'
        produitId:
          type: string
          format: uuid
        quantite:
          type: integer
          description: Positive en entrée, négative en sortie
        auteurId:
          type: string
          format: uuid
        appareilId:
          type: string
          format: uuid
          description: Appareil du geste ; pour un mouvement PROMO, l'appareil du grossiste qui a scanné le QR (auteurId est alors le grossiste)
        horodatage:
          type: string
          format: date-time
          description: Heure du geste (appareil)
        recuLe:
          type: string
          format: date-time
          description: Heure de réception par le serveur
        operationId:
          type: string
          format: uuid
          description: |
            Opération de synchronisation à l'origine du mouvement (l'app remplace ses mouvements
            locaux par ceux du serveur portant le même operationId). Pour un mouvement PROMO, créé
            par le retrait chez le grossiste sans opération de l'appareil : l'id de la réservation.
        documentId:
          type: string
          format: uuid
        bonSortieId:
          type: string
          format: uuid
        campagneId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
        motif:
          type: string
        datePeremption:
          type: string
          format: date
          description: CHARGEMENT seulement, si la ligne chargée la portait (`LigneChargement`)
        prixUnitaire:
          $ref: '#/components/schemas/Montant'
          description: CHARGEMENT seulement, prix d'achat TTC de la ligne chargée (marge, §3.8)

    MouvementPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Mouvement'

    LigneStock:
      type: object
      required: [produitId, quantite]
      properties:
        produitId:
          type: string
          format: uuid
        quantite:
          type: integer
          description: Stock normal ; peut être négatif seulement si une anomalie STOCK_NEGATIF est ouverte (RG-S1)
        peremptionProche:
          type: string
          format: date
          description: |
            Plus proche date de péremption des quantités chargées encore en stock normal (§3.2), en
            supposant que les plus anciennes sont vendues d'abord (premier entré, premier sorti) ;
            absente si aucune ligne chargée encore en stock n'a de date. Aucune alerte n'en part encore.
        promo:
          type: array
          description: Stock promo isolé, par campagne (RG-S3)
          items:
            type: object
            required: [campagneId, reservationId, quantite]
            properties:
              campagneId:
                type: string
                format: uuid
              reservationId:
                type: string
                format: uuid
              quantite:
                type: integer

    StockEmbarque:
      type: object
      required: [lignes, calculeLe]
      properties:
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneStock'
        calculeLe:
          type: string
          format: date-time

    BonSortieSaisie:
      type: object
      required: [id, ambulantTelephone, lignes]
      properties:
        id:
          type: string
          format: uuid
          description: Généré par le client ; renvoyer la même requête ne crée pas un second bon
        ambulantTelephone:
          $ref: '#/components/schemas/Telephone'
          description: Ambulant destinataire (422 si ce numéro n'est pas un ambulant inscrit)
        lignes:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/LigneChargement'

    BonSortie:
      type: object
      required: [id, numero, grossisteId, ambulant, lignes, emisLe, qrJeton]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
        grossisteId:
          type: string
          format: uuid
        ambulant:
          $ref: '#/components/schemas/Reference'
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneChargement'
        emisLe:
          type: string
          format: date-time
        qrJeton:
          type: string
          contentMediaType: application/jwt
          contentSchema:
            $ref: '#/components/schemas/BonSortieQr'
          description: |
            JWS compact signé par le serveur. Sa charge utile (`BonSortieQr`) se lit sans
            vérifier la signature, ce qui permet à l'app ambulant de charger le stock hors ligne.
        chargeLe:
          type: string
          format: date-time
          description: Présent une fois le bon chargé par un ambulant

    BonSortieQr:
      type: object
      description: Charge utile du QR d'un bon de sortie
      required: [bonSortieId, grossisteId, ambulantId, lignes, emisLe]
      properties:
        bonSortieId:
          type: string
          format: uuid
        grossisteId:
          type: string
          format: uuid
        ambulantId:
          type: string
          format: uuid
          description: Seul cet ambulant peut charger le bon ; l'app refuse un QR adressé à un autre
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneChargement'
        emisLe:
          type: string
          format: date-time

    BonSortiePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/BonSortie'

    AmbulantRattache:
      type: object
      required: [id, nom, declare, nombreBons, quantiteTotale, bons30Jours]
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        declare:
          type: boolean
          description: L'ambulant a déclaré ce grossiste dans son profil (`ProfilAmbulantSaisie.grossisteIds`)
        telephone:
          $ref: '#/components/schemas/Telephone'
          description: Seulement si le grossiste lui a émis au moins un bon de sortie (il y a saisi ce numéro)
        nombreBons:
          type: integer
          description: Bons de sortie reçus de ce grossiste
        quantiteTotale:
          type: integer
          format: int64
          description: Volume, en unités, de tous ses bons de sortie
        bons30Jours:
          type: integer
          description: Régularité — bons des 30 derniers jours
        premierBonLe:
          type: string
          format: date-time
          description: Absent si aucun bon de sortie reçu (rattachement déclaré seulement)
        dernierBonLe:
          type: string
          format: date-time
          description: Absent si aucun bon de sortie reçu (rattachement déclaré seulement)

    AmbulantRattachePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/AmbulantRattache'

    # ------------------------------------------------------------ ventes
    TypeDocument:
      type: string
      enum: [BON_LIVRAISON, FACTURE, AVOIR]

    Document:
      type: object
      description: Document de vente émis par un ambulant ; jamais modifié ni supprimé, seulement annulé par avoir (RG-C4)
      required: [id, type, numero, sequence, appareilId, ambulant, hanout, emisLe, lignes, total, montantRegle, montantCredit, statut]
      if:
        properties:
          type:
            const: FACTURE
      then:
        required: [mentionsLegales]
        properties:
          mentionsLegales:
            $ref: '#/components/schemas/MentionsLegales'
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeDocument'
        numero:
          $ref: '#/components/schemas/NumeroDocument'
        sequence:
          $ref: '#/components/schemas/SequenceDocument'
        appareilId:
          type: string
          format: uuid
        ambulant:
          $ref: '#/components/schemas/Reference'
        hanout:
          $ref: '#/components/schemas/Reference'
        emisLe:
          type: string
          format: date-time
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneDocument'
        total:
          $ref: '#/components/schemas/Montant'
        tva:
          $ref: '#/components/schemas/Montant'
          description: |
            TVA comprise dans le total (formule de `TauxTva`), pour une FACTURE dont les mentions
            légales portent `assujettiTva`, et pour un AVOIR qui en annule une (TVA contre-passée) ;
            absente si un taux de ligne est inconnu (anomalie TVA_INCONNUE, RG-F2).
        montantRegle:
          $ref: '#/components/schemas/Montant'
        montantCredit:
          $ref: '#/components/schemas/Montant'
        statut:
          type: string
          enum: [EMIS, PARTIELLEMENT_ANNULE, ANNULE]
          description: Pour BON_LIVRAISON et FACTURE ; un avoir est toujours EMIS
        documentOrigineId:
          type: string
          format: uuid
          description: AVOIR seulement
        avoirIds:
          type: array
          items:
            type: string
            format: uuid
        motifAvoir:
          type: string
        demandeDepannageId:
          type: string
          format: uuid
        mentionsLegales:
          $ref: '#/components/schemas/MentionsLegales'
        confirmationHanout:
          $ref: '#/components/schemas/ConfirmationHanout'
        receptionHanout:
          $ref: '#/components/schemas/ReceptionHanout'

    LigneDocument:
      allOf:
        - $ref: '#/components/schemas/LigneDocumentSaisie'
        - type: object
          required: [libelle, montant]
          properties:
            libelle:
              $ref: '#/components/schemas/LibelleI18n'
            campagneNom:
              $ref: '#/components/schemas/LibelleI18n'
              description: Référence de la campagne imprimée sur la ligne (RG-F3)

    MentionsLegales:
      type: object
      description: Mentions obligatoires d'une FACTURE (RG-F2)
      required: [ice, identifiantFiscal, registreCommerce, assujettiTva]
      properties:
        ice:
          type: string
          pattern: '^[0-9]{15}$'
        identifiantFiscal:
          type: string
        registreCommerce:
          type: string
        assujettiTva:
          type: boolean

    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Document'

    LienDocument:
      type: object
      required: [url, expireLe]
      properties:
        url:
          type: string
          format: uri
        expireLe:
          type: string
          format: date-time

    ReceptionHanoutSaisie:
      type: object
      description: |
        `conforme = true` sans `ecarts` : tout est reçu. `conforme = false` : au moins un écart. Une
        ligne est repérée par son rang dans `Document.lignes` (à partir de 0), car un même produit
        peut y figurer deux fois (stock normal et stock promo, RG-S3) ; seule une ligne ARTICLE porte
        un écart, avec une quantité reçue différente de la quantité livrée.
      required: [id, conforme]
      properties:
        id:
          type: string
          format: uuid
          description: Généré par l'appareil ; clé d'idempotence
        conforme:
          type: boolean
        ecarts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EcartReception'
        commentaire:
          type: string
          maxLength: 500

    EcartReception:
      type: object
      required: [ligne, quantiteRecue]
      properties:
        ligne:
          type: integer
          minimum: 0
        quantiteRecue:
          type: integer
          minimum: 0

    ReceptionHanout:
      type: object
      description: Réception confirmée par le hanout après la livraison (§6), distincte de `confirmationHanout`
      required: [conforme, le]
      properties:
        conforme:
          type: boolean
        ecarts:
          type: array
          items:
            $ref: '#/components/schemas/EcartReception'
        commentaire:
          type: string
        le:
          type: string
          format: date-time

    ContestationSaisie:
      type: object
      required: [id, cible, cibleId, motif]
      properties:
        id:
          type: string
          format: uuid
          description: Généré par l'appareil ; clé d'idempotence
        cible:
          type: string
          enum: [DOCUMENT, COMPTE_CREDIT]
        cibleId:
          type: string
          format: uuid
          description: Un document adressé au hanout, ou l'un de ses comptes de crédit (404 sinon)
        motif:
          type: string
          enum: [MONTANT, QUANTITE, NON_RECU, DEJA_PAYE, AUTRE]
        commentaire:
          type: string
          maxLength: 500

    Contestation:
      allOf:
        - $ref: '#/components/schemas/ContestationSaisie'
        - type: object
          required: [statut, creeLe, ambulant, hanout]
          properties:
            statut:
              type: string
              enum: [OUVERTE, RESOLUE]
            creeLe:
              type: string
              format: date-time
            ambulant:
              $ref: '#/components/schemas/Reference'
            hanout:
              $ref: '#/components/schemas/Reference'
            resolueLe:
              type: string
              format: date-time
            commentaireResolution:
              type: string

    ContestationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Contestation'

    Versement:
      allOf:
        - $ref: '#/components/schemas/VersementSaisie'
        - type: object
          required: [imputations, recuLe, ambulantId]
          properties:
            ambulantId:
              type: string
              format: uuid
            documentId:
              type: string
              format: uuid
              description: Présent si le versement est un règlement saisi à la livraison
            recuLe:
              type: string
              format: date-time

    CompteCredit:
      type: object
      description: Crédit d'un hanout chez un ambulant (karni). solde = factures à crédit − versements − avoirs (RG-C1)
      required: [id, ambulant, hanout, solde]
      properties:
        id:
          type: string
          format: uuid
        ambulant:
          $ref: '#/components/schemas/Reference'
        hanout:
          $ref: '#/components/schemas/Reference'
        solde:
          $ref: '#/components/schemas/Montant'
        plafond:
          $ref: '#/components/schemas/Montant'
        delaiMaxJours:
          type: integer
        plusAncienImpayeLe:
          type: string
          format: date-time
        depassement:
          type: string
          enum: [AUCUN, PLAFOND, DELAI, PLAFOND_ET_DELAI]

    CompteCreditPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/CompteCredit'

    Releve:
      type: object
      required: [compte, ecritures]
      properties:
        compte:
          $ref: '#/components/schemas/CompteCredit'
        soldeInitial:
          $ref: '#/components/schemas/Montant'
        ecritures:
          type: array
          description: Ordre chronologique
          items:
            type: object
            required: [le, nature, montant, soldeApres]
            properties:
              le:
                type: string
                format: date-time
              nature:
                type: string
                enum: [ACHAT_CREDIT, VERSEMENT, AVOIR]
              montant:
                $ref: '#/components/schemas/Montant'
              soldeApres:
                $ref: '#/components/schemas/Montant'
              documentId:
                type: string
                format: uuid
              numero:
                type: string
              versementId:
                type: string
                format: uuid

    SyntheseCreances:
      type: object
      required: [total, anciennete, topDebiteurs]
      properties:
        total:
          $ref: '#/components/schemas/Montant'
        anciennete:
          type: object
          required: [de0a15Jours, de15a30Jours, plusDe30Jours]
          properties:
            de0a15Jours:
              $ref: '#/components/schemas/Montant'
            de15a30Jours:
              $ref: '#/components/schemas/Montant'
            plusDe30Jours:
              $ref: '#/components/schemas/Montant'
        topDebiteurs:
          type: array
          items:
            $ref: '#/components/schemas/CompteCredit'

    # ------------------------------------------------------------ promos
    StatutCampagne:
      type: string
      enum: [BROUILLON, PROPOSEE, ACTIVE, EPUISEE, EXPIREE, CLOTUREE]
      description: |
        BROUILLON → PROPOSEE (premier dépôt proposé) → ACTIVE (au moins un dépôt confirmé) →
        EPUISEE ou EXPIREE → CLOTUREE (reliquats retournés ou rachetés). §7.2

    Remise:
      oneOf:
        - $ref: '#/components/schemas/RemisePourcentage'
        - $ref: '#/components/schemas/RemisePrixNet'
        - $ref: '#/components/schemas/RemiseProduitOffert'
        - $ref: '#/components/schemas/RemisePalier'
      discriminator:
        propertyName: type
        mapping:
          POURCENTAGE: '#/components/schemas/RemisePourcentage'
          PRIX_NET: '#/components/schemas/RemisePrixNet'
          PRODUIT_OFFERT: '#/components/schemas/RemiseProduitOffert'
          PALIER: '#/components/schemas/RemisePalier'

    RemisePourcentage:
      type: object
      required: [type, pourcentage]
      properties:
        type:
          const: POURCENTAGE
        pourcentage:
          type: number
          exclusiveMinimum: 0
          maximum: 100

    RemisePrixNet:
      type: object
      required: [type, prixNet]
      properties:
        type:
          const: PRIX_NET
        prixNet:
          $ref: '#/components/schemas/Montant'

    RemiseProduitOffert:
      type: object
      required: [type, quantiteAchetee, produitOffertId, quantiteOfferte]
      properties:
        type:
          const: PRODUIT_OFFERT
        quantiteAchetee:
          type: integer
          minimum: 1
        produitOffertId:
          type: string
          format: uuid
        quantiteOfferte:
          type: integer
          minimum: 1

    RemisePalier:
      type: object
      required: [type, paliers]
      properties:
        type:
          const: PALIER
        paliers:
          type: array
          minItems: 1
          items:
            type: object
            required: [quantiteMin, pourcentage]
            properties:
              quantiteMin:
                type: integer
                minimum: 1
              pourcentage:
                type: number
                exclusiveMinimum: 0
                maximum: 100

    LigneCampagne:
      type: object
      required: [produitId, remise, quantiteTotale, quantiteMaxParAmbulant]
      properties:
        produitId:
          type: string
          format: uuid
        remise:
          $ref: '#/components/schemas/Remise'
        quantiteTotale:
          type: integer
          minimum: 1
        quantiteMaxParAmbulant:
          type: integer
          minimum: 1
          description: Plafond par ambulant, contrôlé à la réservation et au retrait (RG-P3)
        prixReventeConseille:
          $ref: '#/components/schemas/Montant'
          description: Indicatif seulement ; l'ambulant garde la marge

    Ciblage:
      type: object
      description: |
        Ciblage des ambulants (§5.1, §9) ; vide = toute la zone des dépositaires. Les critères se
        cumulent (chacun présent doit être satisfait), pour le fil (`GET /v1/promos`, entité PROMO)
        comme pour la notification « promo confirmée ».
        **Zone de tournée** d'un ambulant (`zones`, `rayonM`) : les positions des hanouts de ses
        tournées (opération TOURNEE) ; sans tournée, celles des hanouts à qui il a vendu dans les
        30 derniers jours ; sans l'une ni l'autre (compte neuf), aucun filtre géographique au-delà
        des villes et régions du dépositaire : son fil n'est pas vide. Les positions restent sur le
        serveur (CNDP) ; seul le résultat du ciblage est visible.
      properties:
        regions:
          type: array
          items:
            type: string
        villes:
          type: array
          items:
            type: string
        zones:
          type: array
          description: |
            Visé si au moins un hanout de sa zone de tournée est dans l'un de ces polygones (bord
            compris). Un polygone illisible rend la campagne invalide (400).
          maxItems: 20
          items:
            $ref: '#/components/schemas/ZoneGeo'
        categories:
          type: array
          description: |
            Codes de `GET /v1/categories` (§9). Vide ou absent : tous les ambulants. Sinon, l'offre
            vise l'ambulant qui vend au moins une de ces catégories (`ProfilAmbulant.categories`), ou
            qui a déjà acheté la marque du produit (un chargement, un retrait promo ou une vente d'un
            produit de cette marque), ou qui n'a déclaré aucune catégorie (un compte neuf n'a pas un
            fil vide avant de remplir son profil). Même règle pour la notification « promo confirmée ».
          items:
            type: string
        rayonM:
          type: integer
          minimum: 500
          maximum: 50000
          description: |
            Distance maximale entre le grossiste dépositaire et la zone de tournée de l'ambulant :
            visé si le hanout de sa zone le plus proche du dépositaire est à `rayonM` mètres au plus.

    CampagneSaisie:
      type: object
      required: [nom, debut, fin, lignes]
      properties:
        nom:
          $ref: '#/components/schemas/LibelleI18n'
        description:
          $ref: '#/components/schemas/LibelleI18n'
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        lignes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LigneCampagne'
        ciblage:
          $ref: '#/components/schemas/Ciblage'
        delaiRetraitHeures:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
          description: Délai de retrait d'une réservation avant expiration (RG-P2)

    Campagne:
      allOf:
        - $ref: '#/components/schemas/CampagneSaisie'
        - type: object
          required: [id, statut, creeLe, entonnoir]
          properties:
            id:
              type: string
              format: uuid
            statut:
              $ref: '#/components/schemas/StatutCampagne'
            creeLe:
              type: string
              format: date-time
            entonnoir:
              $ref: '#/components/schemas/EtapesEntonnoir'

    CampagnePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Campagne'

    StatutDepot:
      type: string
      enum: [PROPOSE, CONTRE_PROPOSE, ACCEPTE, REFUSE, RECU, CLOTURE]

    PropositionDepot:
      type: object
      required: [grossisteId, lignes]
      properties:
        grossisteId:
          type: string
          format: uuid
        lignes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LigneQuantite'

    LigneDepot:
      type: object
      required: [produitId, quantiteProposee, quantiteDeposee, quantiteReservee, quantiteRetiree, quantiteRestante, quantiteMaxParAmbulant]
      properties:
        produitId:
          type: string
          format: uuid
        quantiteProposee:
          type: integer
        quantiteContreProposee:
          type: integer
        quantiteDeposee:
          type: integer
          description: Quantité réellement reçue ; 0 avant confirmation de réception
        quantiteReservee:
          type: integer
        quantiteRetiree:
          type: integer
        quantiteRestante:
          type: integer
          description: Déposée − réservée − retirée ; une réservation expirée revient ici (RG-P2)
        quantiteMaxParAmbulant:
          type: integer
          description: Plafond par ambulant de la campagne pour ce produit (RG-P3), pour borner la quantité remise au retrait

    Depot:
      type: object
      required: [id, campagne, statutCampagne, grossiste, statut, lignes]
      properties:
        id:
          type: string
          format: uuid
        campagne:
          $ref: '#/components/schemas/Reference'
        statutCampagne:
          $ref: '#/components/schemas/StatutCampagne'
          description: Clôture possible quand le dépôt est RECU et la campagne EPUISEE ou EXPIREE
        marque:
          $ref: '#/components/schemas/Reference'
        grossiste:
          $ref: '#/components/schemas/Grossiste'
        statut:
          $ref: '#/components/schemas/StatutDepot'
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneDepot'
        finCampagne:
          type: string
          format: date-time
        recuLe:
          type: string
          format: date-time
        photoBonLivraisonUrl:
          type: string
          format: uri
        cloture:
          $ref: '#/components/schemas/ClotureDepot'

    ReponseGrossiste:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [ACCEPTER, REFUSER, CONTRE_PROPOSER]
        lignes:
          type: array
          description: Requis pour CONTRE_PROPOSER
          items:
            $ref: '#/components/schemas/LigneQuantite'
        commentaire:
          type: string
          maxLength: 500

    ReponseMarque:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [ACCEPTER, REFUSER]

    ReceptionDepot:
      type: object
      required: [lignes]
      properties:
        lignes:
          type: array
          minItems: 1
          description: Au moins une quantité reçue positive (rien reçu = pas de confirmation, RG-P1)
          contains:
            type: object
            properties:
              quantiteRecue:
                minimum: 1
          items:
            type: object
            required: [produitId, quantiteRecue]
            properties:
              produitId:
                type: string
                format: uuid
              quantiteRecue:
                type: integer
                minimum: 0
        commentaire:
          type: string
          maxLength: 500

    ClotureDepot:
      type: object
      required: [issueReliquat]
      properties:
        issueReliquat:
          type: string
          enum: [RETOURNE, RACHETE]
        commentaire:
          type: string
          maxLength: 500

    DepotPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Depot'

    EtapesEntonnoir:
      type: object
      required: [depose, reserve, retire, revendu]
      properties:
        depose:
          type: integer
          format: int64
        reserve:
          type: integer
          format: int64
        retire:
          type: integer
          format: int64
        revendu:
          type: integer
          format: int64
          description: Unités promo revendues aux hanouts (lignes de documents liées à la campagne, avoirs déduits)

    Entonnoir:
      type: object
      required: [campagneId, total, parGrossiste, parProduit]
      properties:
        campagneId:
          type: string
          format: uuid
        total:
          $ref: '#/components/schemas/EtapesEntonnoir'
        parGrossiste:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/EtapesEntonnoir'
              - type: object
                required: [grossiste]
                properties:
                  grossiste:
                    $ref: '#/components/schemas/Reference'
        parProduit:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/EtapesEntonnoir'
              - type: object
                required: [produitId]
                properties:
                  produitId:
                    type: string
                    format: uuid

    OffrePromo:
      type: object
      required: [id, campagneId, depotId, produit, remise, grossiste, quantiteDisponible, quantiteMaxParAmbulant, quantiteDejaReservee, fin, delaiRetraitHeures]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'offre (campagne × dépôt × produit)
        campagneId:
          type: string
          format: uuid
        campagneNom:
          $ref: '#/components/schemas/LibelleI18n'
        depotId:
          type: string
          format: uuid
        produit:
          $ref: '#/components/schemas/Produit'
        remise:
          $ref: '#/components/schemas/Remise'
        prixReventeConseille:
          $ref: '#/components/schemas/Montant'
        grossiste:
          $ref: '#/components/schemas/Grossiste'
        quantiteDisponible:
          type: integer
        quantiteMaxParAmbulant:
          type: integer
        quantiteDejaReservee:
          type: integer
          description: Déjà réservé ou retiré par l'ambulant connecté sur cette campagne et ce produit
        fin:
          type: string
          format: date-time
        delaiRetraitHeures:
          type: integer
        rattache:
          type: boolean
          description: |
            L'ambulant connecté est rattaché au grossiste dépositaire (déclaré au profil ou bon de
            sortie reçu, §9 : priorité aux ambulants rattachés). Présent dans `GET /v1/promos` ;
            absent de l'entité PROMO tirée hors ligne, où l'app le déduit de `ProfilAmbulant.grossisteIds`
            et des `BonSortie.grossisteId` reçus.

    OffrePromoPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/OffrePromo'

    StatutReservation:
      type: string
      enum: [RESERVEE, RETIREE, EXPIREE, REVENDUE]
      description: RESERVEE → RETIREE (scan QR) ou EXPIREE → REVENDUE (liée à une vente au hanout). §7.2

    ReservationSaisie:
      type: object
      required: [id, offreId, quantite]
      properties:
        id:
          type: string
          format: uuid
          description: Généré par l'appareil ; clé d'idempotence
        offreId:
          type: string
          format: uuid
        quantite:
          type: integer
          minimum: 1

    Reservation:
      type: object
      required: [id, statut, campagneId, depotId, produitId, grossiste, quantiteReservee, reserveeLe, expireLe]
      properties:
        id:
          type: string
          format: uuid
        statut:
          $ref: '#/components/schemas/StatutReservation'
        campagneId:
          type: string
          format: uuid
        depotId:
          type: string
          format: uuid
        produitId:
          type: string
          format: uuid
        grossiste:
          $ref: '#/components/schemas/Grossiste'
        ambulant:
          $ref: '#/components/schemas/Reference'
        quantiteReservee:
          type: integer
        quantiteRetiree:
          type: integer
        quantiteRevendue:
          type: integer
        reserveeLe:
          type: string
          format: date-time
        expireLe:
          type: string
          format: date-time
        retireeLe:
          type: string
          format: date-time
        qrJeton:
          type: string
          contentMediaType: application/jwt
          contentSchema:
            $ref: '#/components/schemas/ReservationQr'
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          description: |
            Contenu du QR code à présenter au grossiste (RG-P4) : JWS compact signé par le serveur,
            d'environ 200 caractères, jamais un code court à saisir. Seul le serveur le vérifie, au
            scan. Renvoyé à l'ambulant seulement, tant que la réservation est RESERVEE.

    ReservationQr:
      type: object
      description: Charge utile du QR d'une réservation
      required: [reservationId, depotId]
      properties:
        reservationId:
          type: string
          format: uuid
        depotId:
          type: string
          format: uuid

    ReservationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/Reservation'

    ScanQr:
      type: object
      required: [qrJeton]
      properties:
        qrJeton:
          type: string

    RetraitSaisie:
      allOf:
        - $ref: '#/components/schemas/ScanQr'
        - type: object
          required: [quantiteRemise, appareilId]
          properties:
            appareilId:
              type: string
              format: uuid
              description: Appareil (ou navigateur) du grossiste qui scanne, celui de la session (403 sinon) ; porté par le mouvement PROMO (RG-S2)
            quantiteRemise:
              type: integer
              minimum: 1
              description: Au plus la quantité réservée

    # ------------------------------------------------------------ depannage
    DisponibiliteSaisie:
      type: object
      required: [disponible]
      properties:
        disponible:
          type: boolean
        position:
          $ref: '#/components/schemas/Position'
          description: Requise avec disponible = true (400 sinon) ; ignorée avec disponible = false

    Disponibilite:
      type: object
      required: [disponible]
      properties:
        disponible:
          type: boolean
        depuis:
          type: string
          format: date-time
        positionMiseAJourLe:
          type: string
          format: date-time

    StatutDemande:
      type: string
      enum: [EN_ATTENTE, ACCEPTEE, EN_ROUTE, LIVREE, SANS_REPONSE]
      description: SANS_REPONSE quand personne n'a accepté après l'élargissement du rayon (RG-D3)

    RuptureSaisie:
      type: object
      description: |
        Produit choisi dans la liste (`produitId`) ; avec une photo (multipart), `produitId` peut
        manquer (destinataires : voir `POST /v1/demandes-depannage`, question ouverte sur RG-D1)
      required: [id, quantite]
      properties:
        id:
          type: string
          format: uuid
          description: Généré par l'appareil ; clé d'idempotence
        produitId:
          type: string
          format: uuid
        quantite:
          type: integer
          minimum: 1

    DemandeDepannage:
      type: object
      required: [id, statut, quantite, creeLe, historique]
      properties:
        id:
          type: string
          format: uuid
        statut:
          $ref: '#/components/schemas/StatutDemande'
        produit:
          $ref: '#/components/schemas/Produit'
        photoUrl:
          type: string
          format: uri
        quantite:
          type: integer
        creeLe:
          type: string
          format: date-time
        rayonElargi:
          type: boolean
        expireLe:
          type: string
          format: date-time
          description: Fin du délai d'acceptation en cours
        hanout:
          type: object
          description: Vue ambulant seulement
          required: [id, nom, position]
          properties:
            id:
              type: string
              format: uuid
            nom:
              type: string
            position:
              $ref: '#/components/schemas/Position'
            distanceM:
              type: integer
            solde:
              $ref: '#/components/schemas/Montant'
              description: Solde du hanout chez l'ambulant connecté
            derniereVenteLe:
              type: string
              format: date-time
        ambulant:
          type: object
          description: Vue hanout seulement, une fois la demande acceptée
          required: [nom, telephone]
          properties:
            nom:
              type: string
            telephone:
              $ref: '#/components/schemas/Telephone'
        documentId:
          type: string
          format: uuid
          description: Vente liée, une fois livrée (RG-D4)
        historique:
          type: array
          items:
            type: object
            required: [statut, le]
            properties:
              statut:
                $ref: '#/components/schemas/StatutDemande'
              le:
                type: string
                format: date-time

    DemandeDepannagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [contenu]
          properties:
            contenu:
              type: array
              items:
                $ref: '#/components/schemas/DemandeDepannage'

    # ------------------------------------------------------------ analytique
    CarteRuptures:
      type: object
      required: [seuilAnonymat, genereLe, cellules]
      properties:
        seuilAnonymat:
          type: integer
          description: Nombre minimal de hanouts distincts pour qu'une cellule soit renvoyée
          examples: [3]
        genereLe:
          type: string
          format: date-time
        cellules:
          type: array
          items:
            type: object
            required: [geohash, centre, produitId, signalements, resolues, enCours]
            properties:
              geohash:
                type: string
              centre:
                $ref: '#/components/schemas/Position'
              produitId:
                type: string
                format: uuid
              signalements:
                type: integer
              resolues:
                type: integer
              enCours:
                type: integer
              delaiMoyenResolutionMinutes:
                type: integer
