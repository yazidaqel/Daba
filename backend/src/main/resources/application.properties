spring.application.name=daba

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/daba}
spring.datasource.username=${DB_USER:daba}
spring.datasource.password=${DB_PASSWORD:daba}

# Le schéma appartient à Flyway ; Hibernate ne fait que le valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Réponses JSON : champs absents plutôt que null.
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Outbox : les événements non traités sont republiés au redémarrage.
spring.modulith.events.republish-outstanding-events-on-restart=true

# Clé de signature des jetons (accès, liens hanout, QR), 32 caractères minimum ; absente, une clé
# aléatoire est générée et conservée en base au premier démarrage.
daba.jwt.secret=${DABA_JWT_SECRET:}
# Base des liens hanout envoyés par SMS (PWA).
daba.liens.base-url=${DABA_LIENS_BASE_URL:http://localhost:5173/l/}
# Numéros qui deviennent administrateurs à leur première connexion (séparés par des virgules).
daba.admin.telephones=${DABA_ADMIN_TELEPHONES:}
# Canaux : valeurs par défaut, que l'administrateur remplace sans redémarrage (PUT /v1/admin/canaux).
# Canaux actifs (PUSH, SMS, WHATSAPP) ; routage par type : daba.canaux.routage.<TYPE>=PRINCIPAL,REPLI
daba.canaux.actifs=${DABA_CANAUX_ACTIFS:PUSH,SMS}
# Fournisseurs : identifiants dans l'environnement seulement (jamais en base ni dans l'API).
# Vides : le canal reste sur JOURNAL (message écrit dans les logs).
daba.canaux.infobip.base-url=${DABA_INFOBIP_BASE_URL:}
daba.canaux.infobip.api-key=${DABA_INFOBIP_API_KEY:}
daba.canaux.infobip.sender=${DABA_INFOBIP_SENDER:}
daba.canaux.fcm.project-id=${DABA_FCM_PROJECT_ID:}
daba.canaux.fcm.credentials=${DABA_FCM_CREDENTIALS:}
daba.canaux.fcm.url=https://fcm.googleapis.com
daba.api.base-url=${DABA_API_BASE_URL:http://localhost:8080}

# Dépannage (RG-D1, RG-D3) : rayon initial, rayon élargi une fois, délai d'acceptation.
daba.depannage.rayon-m=${DABA_DEPANNAGE_RAYON_M:3000}
daba.depannage.rayon-elargi-m=${DABA_DEPANNAGE_RAYON_ELARGI_M:6000}
daba.depannage.delai-acceptation=${DABA_DEPANNAGE_DELAI:PT10M}
# Carte des ruptures : nombre minimal de hanouts distincts par cellule (§5.4).
daba.analytique.seuil-anonymat=3
